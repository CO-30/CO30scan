/* ============================================================
   ドラッグ
   ============================================================ */
let press=null, ghost=null, rubber=null;

document.addEventListener('pointerdown',e=>{
  const chip=e.target.closest('.chip[data-kind]');
  const hand=e.target.closest('.hand');
  const link=e.target.closest('.link');
  const blk =e.target.closest('.block');
  const nd  =e.target.closest&&e.target.closest('.node');
  const pt  =e.target.closest&&e.target.closest('.pt');
  const seg =e.target.closest&&e.target.closest('.seg');
  if(!chip&&!blk&&!seg&&!pt&&!nd) return;
  if(e.button&&e.button!==0) return;
  const touch=e.pointerType!=='mouse';
  press={x:e.clientX,y:e.clientY,id:e.pointerId,started:false,timer:null,
         kind:nd?'node':(pt?'pt':(seg?'segmove':(link?'link':(hand?'resize':(chip?'new':'move'))))), side:hand?hand.dataset.h:null,
         chip,blk,seg,pt,nd,shift:!!(e.shiftKey||e.metaKey||e.ctrlKey),
         target:(link||hand||pt||nd||blk||seg||chip)};
  if(chip&&chip.dataset.kind==='who'){ state.hoverStaff=chip.dataset.id; renderBlocks(); }
  if(touch) press.timer=setTimeout(()=>beginDrag(e),180);
},{passive:true});

document.addEventListener('pointermove',e=>{
  if(!press||e.pointerId!==press.id) return;
  const dx=e.clientX-press.x, dy=e.clientY-press.y;
  if(!press.started){
    const far=Math.hypot(dx,dy)>(e.pointerType==='mouse'?4:12);
    if(far&&press.timer){ clearTimeout(press.timer); press.timer=null; endPress(); return; }
    if(far&&e.pointerType==='mouse') beginDrag(e);
    return;
  }
  e.preventDefault(); onDragMove(e);
},{passive:false});

document.addEventListener('pointerup',e=>{
  if(!press||e.pointerId!==press.id) return;
  if(press.timer) clearTimeout(press.timer);
  if(press.started) finishDrag(e); else tap(e);
  endPress();
});
document.addEventListener('pointercancel',()=>{ if(press){ if(press.timer) clearTimeout(press.timer); killGhost(); killRubber(); } endPress(); });

function endPress(){
  press=null;
  if(state.hoverStaff){ state.hoverStaff=null; renderBlocks(); }
  if(state.check!==state.sel){ state.check=state.sel; updateWhoFlags(); }
}

function beginDrag(e){
  press.started=true;
  try{ press.target.setPointerCapture(press.id); }catch(_){}
  if(press.kind==='new'){
    const k=press.chip.dataset.kind, id=press.chip.dataset.id;
    let m1='',m2='';
    if(k==='do'){ const d=getDo(id); m1=doLabel(d); m2=d.blank?'行に置く':'荷台か行に置く'; }
    if(k==='how'){ const h=getHow(id); m1=h.name; m2='行／ブロック／＋'; }
    if(k==='who'){ const p=getWho(id); m1=p.name; m2='ブロックに重ねる'; }
    if(k==='tpl'){ const t=TEMPLATES.find(x=>x.id===id); m1=t.name; m2=t.steps.length+'工程をまとめて置く'; }
    if(k==='crew'){ const cr=CREWS.find(x=>x.id===id); m1=cr.name; m2=cr.members.length+'人をまとめて入れる'; }
    ghost=el('div','ghost');
    ghost.style.borderLeftColor=k==='do'?'var(--do)':(k==='how'?'var(--how)':(k==='tpl'?'var(--ink)':'var(--who)'));
    ghost.innerHTML=esc(m1)+'<div class="g2">'+esc(m2)+'</div>';
    document.body.appendChild(ghost); moveGhost(e);
  }else if(press.kind==='node'){
    const p=POS[press.nd.dataset.node]||{x:press.nd.offsetLeft,y:press.nd.offsetTop};
    press.origin={x:e.clientX,y:e.clientY,nx:p.x,ny:p.y};
  }else if(press.kind==='pt'||press.kind==='segmove'){
    const src=press.pt||press.seg;
    const b=getBlk(src.dataset.id);
    press.bid=b.id;
    press.end=press.pt?press.pt.dataset.end:null;
    press.origin={x:e.clientX, t:b.t, dur:b.dur, place:b.place, to:b.to,
                  r1:placeIdx(b.place), r2:placeIdx(b.to||b.place)};
  }else if(press.kind==='link'){
    const r=press.blk.getBoundingClientRect();
    press.from={x:r.right-9,y:r.top+10};
    makeRubber(); moveRubber(e);
  }else{
    const b=getBlk(press.blk.dataset.id);
    press.origin={t:b.t,dur:b.dur,laneId:b.laneId,x:e.clientX};
  }
}
function moveGhost(e){ if(!ghost) return; ghost.style.left=(e.clientX+14)+'px'; ghost.style.top=(e.clientY-14)+'px'; }
function killGhost(){
  if(ghost){ ghost.remove(); ghost=null; }
  document.querySelectorAll('.lane.hot,.knob.hot,.bed.hot,.cargo.hot').forEach(n=>n.classList.remove('hot'));
  document.querySelectorAll('.node[data-hot]').forEach(n=>{ delete n.dataset.hot; });
}
function makeRubber(){
  killRubber();
  rubber=document.createElementNS('http://www.w3.org/2000/svg','svg');
  rubber.setAttribute('class','rubber');
  rubber.innerHTML='<path d="" fill="none" stroke="#54479A" stroke-width="2.2" stroke-dasharray="6 4"/><circle r="4.5" fill="#54479A"/>';
  document.body.appendChild(rubber);
}
function moveRubber(e){
  if(!rubber||!press||!press.from) return;
  const f=press.from, p=rubber.querySelector('path'), c=rubber.querySelector('circle');
  const mx=(f.x+e.clientX)/2;
  p.setAttribute('d','M'+f.x+','+f.y+' C'+mx+','+f.y+' '+mx+','+e.clientY+' '+e.clientX+','+e.clientY);
  c.setAttribute('cx',e.clientX); c.setAttribute('cy',e.clientY);
}
function killRubber(){
  if(rubber){ rubber.remove(); rubber=null; }
  document.querySelectorAll('.block.tgt').forEach(n=>n.classList.remove('tgt'));
}
function rowAtY(y){
  const r=$('#lanes').getBoundingClientRect();
  return clamp(Math.floor((y-r.top)/LH),0,VL.length-1);
}
function rowPlace(i){
  const p=PLACES[i];
  return (p&&p.name!=='その他・未設定')?p.name:null;
}
function laneElAt(e){
  let l=hitAt(e,'.lane');
  if(l&&l.dataset.rtype==='people'&&state.view==='lane'){
    const real=document.querySelector('.lane[data-lane="'+l.dataset.src+'"]');
    if(real) l=real;
  }
  if(l) return l;
  if(state.view!=='diagram') return null;
  const all=document.querySelectorAll('.lane');
  return all[rowAtY(e.clientY)]||null;
}
function dropTarget(laneEl){
  if(laneEl&&laneEl.dataset.rtype==='people'&&state.view==='lane'){
    const real=document.querySelector('.lane[data-lane="'+laneEl.dataset.src+'"]');
    if(real) laneEl=real;
  }
  if(state.view==='diagram'){
    const i=Array.prototype.indexOf.call(document.querySelectorAll('.lane'),laneEl);
    return {laneId:(LANES[0]?LANES[0].id:''), place:rowPlace(i<0?0:i)};
  }
  return {laneId:laneEl.dataset.lane, place:null};
}
function hitAt(e,sel){ const n=document.elementFromPoint(e.clientX,e.clientY); return n?n.closest(sel):null; }

function onDragMove(e){
  if(press.kind==='new'){
    moveGhost(e);
    document.querySelectorAll('.lane.hot,.knob.hot,.bed.hot,.cargo.hot').forEach(n=>n.classList.remove('hot'));
    const k=press.chip.dataset.kind;
    if(k==='do'){
      const bed=hitAt(e,'.bed'), cg=hitAt(e,'.cargo[data-cargo]');
      if(bed) bed.classList.add('hot');
      else if(cg) cg.classList.add('hot');
      else { const lane=laneElAt(e); if(lane) lane.classList.add('hot'); }
    }
    if(k==='how'||k==='tpl'){
      const kn=hitAt(e,'.knob');
      if(kn&&k==='how') kn.classList.add('hot');
      else { const lane=laneElAt(e); if(lane) lane.classList.add('hot'); }
    }
    if(k==='crew'){
      const t2=hitAt(e,'.block')||hitAt(e,'.seg')||hitAt(e,'.node');
      const nt3=(t2&&t2.dataset.node)?nodeTarget(t2.dataset.node):null;
      const id2=t2?(nt3?nt3.blockId:t2.dataset.id):null;
      if(state.check!==id2){ state.check=id2; updateWhoFlags(); }
    }
    document.querySelectorAll('.node[data-hot]').forEach(n=>{ delete n.dataset.hot; });
    const nh=hitAt(e,'.node'); if(nh) nh.dataset.hot='1';
    if(k==='who'){
      const t=hitAt(e,'.block')||hitAt(e,'.seg')||hitAt(e,'.node');
      const nt2=(t&&t.dataset.node)?nodeTarget(t.dataset.node):null;
      const id=t?(nt2?nt2.blockId:t.dataset.id):null;
      if(state.check!==id){ state.check=id; updateWhoFlags(); }
    }
    return;
  }
  if(press.kind==='node'){
    const o=press.origin, id=press.nd.dataset.node;
    POS[id]={x:Math.max(8,o.nx+(e.clientX-o.x)), y:Math.max(8,o.ny+(e.clientY-o.y))};
    press.nd.style.left=POS[id].x+'px'; press.nd.style.top=POS[id].y+'px';
    return;
  }
  if(press.kind==='pt'||press.kind==='segmove'){
    const b=getBlk(press.bid), o=press.origin;
    if(!b) return;
    const dt=snap((e.clientX-o.x)/state.ppm), row=rowAtY(e.clientY);
    if(press.kind==='segmove'){
      b.t=clamp(o.t+dt,TL_START,TL_END-b.dur);
      const d=b.stops?0:(row-o.r1);
      if(d!==0){
        b.place=rowPlace(clamp(o.r1+d,0,PLACES.length-1));
        b.to = o.to ? rowPlace(clamp(o.r2+d,0,PLACES.length-1)) : null;
      }else{ b.place=o.place; b.to=o.to; }
    }else if(press.end==='s'){
      const nt=clamp(o.t+dt,TL_START,o.t+o.dur-SNAP);
      if(b.stops){ b.t=clamp(o.t+dt,TL_START,TL_END-b.dur); }
      else{ b.dur=o.t+o.dur-nt; b.t=nt; b.place=rowPlace(row); }
    }else if(b.stops){
      b.t=clamp(o.t+dt,TL_START,TL_END-b.dur);
    }else{
      b.dur=clamp(o.dur+dt,SNAP,TL_END-b.t);
      const pn=rowPlace(row);
      b.to = (pn===b.place)?null:pn;
    }
    renderBlocks();
    if(state.sel===b.id) openDetail(b.id);
    return;
  }
  if(press.kind==='link'){
    moveRubber(e);
    document.querySelectorAll('.block.tgt').forEach(n=>n.classList.remove('tgt'));
    const t=hitAt(e,'.block');
    if(t&&t.dataset.id!==press.blk.dataset.id) t.classList.add('tgt');
    return;
  }
  const b=getBlk(press.blk.dataset.id), o=press.origin, dx=e.clientX-o.x;
  if(press.kind==='move'){
    b.t=clamp(snap(o.t+dx/state.ppm),TL_START,TL_END-b.dur);
    let lane=hitAt(e,'.lane');
    if(lane&&lane.dataset.rtype==='people') lane=document.querySelector('.lane[data-lane="'+lane.dataset.src+'"]');
    if(lane&&state.view==='lane'&&lane.dataset.lane!==b.laneId){
      const list=steps(b.chainId);
      if(list.length>1){
        list.forEach(x=>{ x.laneId=lane.dataset.lane; });   /* 便はまるごと同じ行へ */
        press.movedChain=true;
      }else{
        b.laneId=lane.dataset.lane;
      }
    }
  }else if(press.side==='l'){
    const ns=clamp(snap(o.t+dx/state.ppm),TL_START,o.t+o.dur-SNAP);
    b.dur=o.t+o.dur-ns; b.t=ns;
  }else{
    b.dur=clamp(snap(o.dur+dx/state.ppm),SNAP,TL_END-b.t);
  }
  renderBlocks();
  if(state.sel===b.id) openDetail(b.id);
}

function finishDrag(e){
  if(press.kind==='node'){ renderMind(); return; }
  if(press.kind==='pt'||press.kind==='segmove'){ renderAll(); return; }
  if(press.kind==='move'&&press.movedChain){
    const b0=getBlk(press.blk.dataset.id), ln0=b0?LANES.find(l=>l.id===b0.laneId):null;
    toast('この便をまるごと'+(ln0?ln0.name:'別の行')+'に移しました。');
  }
  if(press.kind==='link'){ finishLink(e); return; }
  if(press.kind!=='new'){ killGhost(); renderAll(); return; }
  const k=press.chip.dataset.kind, id=press.chip.dataset.id;
  const bed=hitAt(e,'.bed'), kn=hitAt(e,'.knob'), onBlk=hitAt(e,'.block');
  const segHit=hitAt(e,'.seg');
  const nodeEl=hitAt(e,'.node');
  const nt=nodeEl?nodeTarget(nodeEl.dataset.node):null;
  const blkId=onBlk?onBlk.dataset.id:(segHit?segHit.dataset.id:(nt?nt.blockId:null));
  if(state.view==='mind'&&!nodeEl&&(k==='how'||k==='tpl'||k==='do')){
    const pr=$('#mindpane').getBoundingClientRect();
    const x=e.clientX-pr.left, y=e.clientY-pr.top;
    if(k==='how'){ const b=newMindChain(x,y,id); killGhost(); toast('置きました。'); return; }
    if(k==='do'){ const b=newMindChain(x,y,'h2'); getChain(b.chainId).loads.push(id);
      const d1=getDo(id); if(d1&&!d1.blank) b.place=d1.from;
      killGhost(); openDetail(b.id); renderAll(); toast('荷物つきの便を作りました。'); return; }
    if(k==='tpl'){
      const t=TEMPLATES.find(x2=>x2.id===id);
      const b0=newMindChain(x,y,t.steps[0].how); b0.dur=t.steps[0].dur;
      let last=b0;
      t.steps.slice(1).forEach(st=>{
        const pl=inferPlace(b0.chainId,st.how,last);
        const nb={id:uid('b'), chainId:b0.chainId, howId:st.how, laneId:last.laneId,
                  t:last.t+last.dur, dur:st.dur, staff:[], place:pl.place, to:pl.to, note:''};
        BLOCKS.push(nb); last=nb;
      });
      killGhost(); openDetail(b0.id); renderAll(); toast(t.steps.length+'工程の便を作りました。'); return;
    }
  }
  const lane=(k==='do'||k==='how'||k==='tpl')?laneElAt(e):hitAt(e,'.lane');

  if(k==='do'){
    const cargoBox=hitAt(e,'.cargo[data-cargo]');
    if(cargoBox && cargoBox.dataset.blk){
      const tb=getBlk(cargoBox.dataset.blk), d2=getDo(id);
      if(tb && d2 && d2.lines){
        const isDrop2=(tb.howId==='h4');
        const arr=isDrop2?(tb.drop=tb.drop||[]):(tb.load=tb.load||[]);
        d2.lines.forEach(l=>{ if(!arr.some(x=>x.d===d2.id&&x.l===l.id)) arr.push({d:d2.id,l:l.id,q:l.qty}); });
        syncChainLoads(getChain(tb.chainId));
        killGhost(); openDetail(tb.id); renderAll();
        toast(isDrop2?'ここで降ろす物に加えました。':'この積み込みに加えました。'); return;
      }
    }
    const tgt = bed ? bed.dataset.bed
              : (cargoBox ? cargoBox.dataset.cargo
              : (blkId ? getBlk(blkId).chainId : (nt?nt.chainId:null)));
    if(blkId){
      const tb=getBlk(blkId), d3=getDo(id);
      if(tb && d3 && d3.lines && (tb.howId==='h2'||tb.howId==='h4')){
        const isDrop3=(tb.howId==='h4');
        const arr=isDrop3?(tb.drop=tb.drop||[]):(tb.load=tb.load||[]);
        d3.lines.forEach(l=>{ if(!arr.some(x=>x.d===d3.id&&x.l===l.id)) arr.push({d:d3.id,l:l.id,q:l.qty}); });
        syncChainLoads(getChain(tb.chainId));
        killGhost(); openDetail(tb.id); renderAll();
        toast(isDrop3?'ここで降ろす物に加えました。':'この積み込みに加えました。'); return;
      }
    }
    if(tgt){
      const c=getChain(tgt);
      if(c.loads.includes(id)) toast('その荷物はもう積まれています。');
      else { c.loads.push(id); toast('この便に積みました。'); }
      const first=steps(c.id)[0];
      killGhost(); openDetail(first?first.id:null); renderAll(); return;
    }
    if(state.view==='person'){ toast('「行」か「ダイヤ」の表示で置いてください。'); killGhost(); return; }
    if(!lane){ toast('タイムラインの行、または荷台に置いてください。'); killGhost(); return; }
    const rect=lane.getBoundingClientRect();
    const dt0=dropTarget(lane);
    const c={id:uid('c'), loads:[id], tm:state.tmNew}; CHAINS.push(c);
    const d0=getDo(id);
    const b={id:uid('b'), chainId:c.id, howId:'h2', laneId:dt0.laneId,
             t:x2t(e.clientX-rect.left), dur:40, staff:[],
             place:dt0.place||((d0&&!d0.blank)?d0.from:null), to:null, note:''};
    BLOCKS.push(b); killGhost(); openDetail(b.id); renderAll();
    toast('荷台に②を重ねれば同じ便に積めます。右の＋で次のやることへ。');
    return;
  }
  if(k==='how'){
    if(kn){ appendStep(kn.dataset.chain,id); killGhost(); return; }
    if(blkId){
      const b=getBlk(blkId);
      if(!b.howId){ b.howId=id; openDetail(b.id); renderAll(); afterPlaceHow(b); }
      else { const nb=appendStep(b.chainId,id); afterPlaceHow(nb); }
      killGhost(); return;
    }
    if(lane&&state.view==='person'){ toast('「行」か「ダイヤ」の表示で置いてください。'); killGhost(); return; }
    if(lane){
      const rect=lane.getBoundingClientRect();
      const dt1=dropTarget(lane);
      const hh1=getHow(id);
      if(hh1&&hh1.ride){
        const rb=newRide(dt1.laneId, x2t(e.clientX-rect.left),
          [dt1.place||'自宅・集合','レンタル会社'], []);
        killGhost(); openDetail(rb.id); renderAll();
        toast('送迎を置きました。①で停車地と乗り降りを決められます。'); return;
      }
      const c={id:uid('c'), loads:[], tm:state.tmNew}; CHAINS.push(c);
      const b={id:uid('b'), chainId:c.id, howId:id, laneId:dt1.laneId,
               t:x2t(e.clientX-rect.left), dur:40, staff:[], place:dt1.place, to:null, note:''};
      BLOCKS.push(b); killGhost(); openDetail(b.id); renderAll(); afterPlaceHow(b);
      toast('置きました。右上の⇢から紐を引くと、ほかの便につなげます。'); return;
    }
    toast('③は行に置くか、ブロック／端の「＋」に重ねます。'); killGhost(); return;
  }
  if(k==='tpl'){
    if(state.view==='person'||!lane){ toast('型は「行」か「ダイヤ」の表示で置いてください。'); killGhost(); return; }
    const t=TEMPLATES.find(x=>x.id===id);
    const rect=lane.getBoundingClientRect();
    const dt2=dropTarget(lane);
    let cur=x2t(e.clientX-rect.left);
    const c={id:uid('c'), loads:[], tm:state.tmNew}; CHAINS.push(c);
    let last=null, first=null;
    t.steps.forEach(st=>{
      const pl=inferPlace(c.id,st.how,last);
      if(!last&&dt2.place) pl.place=dt2.place;
      const nb={id:uid('b'), chainId:c.id, howId:st.how, laneId:dt2.laneId,
                t:clamp(cur,TL_START,TL_END-st.dur), dur:st.dur, staff:[],
                place:pl.place, to:pl.to, note:''};
      BLOCKS.push(nb); last=nb; if(!first) first=nb; cur+=st.dur;
    });
    killGhost(); openDetail(first.id); renderAll();
    toast(t.steps.length+'工程を置きました。②を荷台に積むと場所も自動で入ります。');
    return;
  }
  if(k==='crew'){
    if(!blkId){ toast('班は予定の上に重ねてください。'); killGhost(); return; }
    const b=getBlk(blkId), cr=CREWS.find(x=>x.id===id);
    let add=0, ng=0;
    cr.members.forEach(m=>{
      if(b.staff.includes(m)) return;
      if(whoStatus(m,b)!=='ok') ng++;
      b.staff.push(m); add++;
    });
    killGhost(); openDetail(b.id); renderAll();
    toast(ng?(add+'人入れました（うち'+ng+'人は重複／時間外）'):(add+'人入れました。'));
    return;
  }
  if(k==='who'&&state.view==='lane'){
    const row=hitAt(e,'.lane[data-rtype="people"]');
    if(row){
      const rect=row.getBoundingClientRect(), t0=x2t(e.clientX-rect.left);
      const cand=BLOCKS.filter(function(b){return b.laneId===row.dataset.src&&b.t<=t0&&t0<b.t+b.dur;})[0]
              || BLOCKS.filter(function(b){return b.laneId===row.dataset.src;}).sort(function(a,b2){
                   return Math.abs(a.t-t0)-Math.abs(b2.t-t0);})[0];
      if(!cand){ toast('この車両にはまだ予定がありません。'); killGhost(); return; }
      if(cand.staff.indexOf(id)<0) cand.staff.push(id);
      killGhost(); openDetail(cand.id); renderAll(); return;
    }
  }
  if(k==='who'&&state.view==='place'){
    const row=hitAt(e,'.lane[data-rtype]');
    if(row){
      const rect=row.getBoundingClientRect();
      const sN={id:uid('s'), pid:id, place:row.dataset.place,
        t:x2t(e.clientX-rect.left), dur:60, how:null, arrive:null, note:''};
      PSHIFTS.push(sN);
      killGhost(); renderAll();
      showHowMenu(e.clientX,e.clientY,hh=>{ sN.how=hh.id; renderAll(); });
      return;
    }
  }
  if(k==='who'){
    const crChip=hitAt(e,'.chip.crew');
    if(crChip){
      const cr=CREWS.find(x=>x.id===crChip.dataset.id);
      if(cr&&!cr.members.includes(id)){ cr.members.push(id); toast('班に加えました。'); }
      killGhost(); renderAll(); return;
    }
    if(!blkId){ toast('④は予定の上に重ねてください。'); killGhost(); return; }
    const b=getBlk(blkId);
    const st=whoStatus(id,b);
    if(b.staff.includes(id)) toast('その人はもう入っています。');
    else{
      b.staff.push(id);
      if(st==='busy') toast('入れましたが、ほかの予定と重なっています。');
      else if(st==='out') toast('入れましたが、奉仕可能な時間の外です。');
    }
    killGhost(); openDetail(b.id); renderAll(); return;
  }
  killGhost();
}
function finishLink(e){
  const t=hitAt(e,'.block'); const me=press.blk.dataset.id; killRubber();
  if(!t||t.dataset.id===me){ toast('つなぎたいブロックの上で離してください。'); return; }
  const a=getBlk(me), b=getBlk(t.dataset.id);
  if(a.chainId===b.chainId){ toast('もう同じ便です。'); return; }
  const from=getChain(b.chainId), to=getChain(a.chainId);
  const keepLane=a.laneId;
  BLOCKS.filter(x=>x.chainId===from.id).forEach(x=>{x.chainId=to.id; x.laneId=keepLane;});
  from.loads.forEach(l=>{ if(!to.loads.includes(l)) to.loads.push(l); });
  CHAINS=CHAINS.filter(c=>c.id!==from.id);
  openDetail(a.id); renderAll(); toast('同じ便につなぎました。');
}
function addStepAndPick(chainId,howId){
  const nb=appendStep(chainId,howId);
  afterPlaceHow(nb);
  return nb;
}
function afterPlaceHow(b){
  if(!b) return;
  const h=getHow(b.howId); if(!h) return;
  if(h.id==='h2') setTimeout(()=>showLoadPicker(b),80);
  else if(h.id==='h4') setTimeout(()=>showDropPicker(b),80);
}
function appendStep(chainId,howId){
  const list=steps(chainId); if(!list.length) return;
  const last=list[list.length-1];
  const pl=inferPlace(chainId,howId,last);
  const b={id:uid('b'), chainId, howId, laneId:last.laneId,
           t:clamp(last.t+last.dur,TL_START,TL_END-30), dur:30, staff:last.staff.slice(),
           place:pl.place, to:pl.to, note:''};
  BLOCKS.push(b); openDetail(b.id); renderAll();
  return b;
}
function tap(e){
  const chip=press.chip, blk=press.blk, seg=press.seg||press.pt;
  if(press.nd){
    const nt=nodeTarget(press.nd.dataset.node);
    const k0=press.nd.dataset.node.slice(0,1);
    if(k0==='w'){ openPerson(press.nd.dataset.node.split(':')[2]); return; }
    if(nt&&nt.blockId){ openDetail(nt.blockId); renderMind(); }
    return;
  }
  if(blk&&press.shift){
    const id=blk.dataset.id;
    if(MULTI[id]) delete MULTI[id]; else MULTI[id]=1;
    updateMultiBar(); renderBlocks(); return;
  }
  if(seg){ openDetail(seg.dataset.id); renderBlocks(); return; }
  if(blk){ openDetail(blk.dataset.id); renderBlocks(); return; }
  if(chip&&chip.dataset.kind==='who'){
    state.focus = (state.focus===chip.dataset.id)?null:chip.dataset.id;
    openPerson(chip.dataset.id); return;
  }
  if(chip&&chip.dataset.kind==='do'){ openDo(chip.dataset.id); return; }
  if(chip&&chip.dataset.kind==='how'){ toast('③は行かブロック、端の「＋」に置いて使います。'); return; }
  if(chip&&chip.dataset.kind==='tpl'){ toast('型は「行」の表示で、行にドラッグして置きます。'); return; }
  if(chip&&chip.dataset.kind==='crew'){ toast('班はブロックに重ねて使います。人を重ねると班に加われます。'); return; }
}

let menuEl=null;
function showHowMenu(x,y,cb){
  closeMenu();
  menuEl=el('div','menu');
  HOWS.forEach(h=>{
    const b=el('button'); b.innerHTML=howIcon(h)+esc(h.name);
    b.addEventListener('click',()=>{ closeMenu(); cb(h); });
    menuEl.appendChild(b);
  });
  const nb=el('button','wide'); nb.textContent='＋ 新しいやることを作る';
  nb.addEventListener('click',()=>{ closeMenu(); addCustomHow(h=>cb(h)); });
  menuEl.appendChild(nb);
  document.body.appendChild(menuEl);
  const r=menuEl.getBoundingClientRect();
  menuEl.style.left=Math.max(8,Math.min(x,innerWidth-r.width-10))+'px';
  menuEl.style.top =Math.max(8,Math.min(y,innerHeight-r.height-10))+'px';
  setTimeout(()=>document.addEventListener('pointerdown',outside,{once:true}),0);
}
function issueSheet(title, build){
  const scrim=el('div','scrim'), box=el('div','sheet wide');
  const draw=()=>{
    box.innerHTML='<h3>'+esc(title)+'</h3><div class="in" id="is-body"></div>'
      +'<div class="acts" style="grid-template-columns:1fr"><button type="button" id="is-no">閉じる</button></div>';
    box.querySelector('#is-no').onclick=()=>{ scrim.remove(); renderAll(); };
    build(box.querySelector('#is-body'), ()=>{ renderAll(); draw(); });
  };
  scrim.appendChild(box); document.body.appendChild(scrim);
  scrim.addEventListener('click',ev=>{ if(ev.target===scrim){ scrim.remove(); renderAll(); } });
  draw();
}
function issueRow(host,t1,t2,bad,btns){
  const d=el('div','isr');
  d.innerHTML='<div class="t1">'+t1+'</div><div class="t2'+(bad?' bad':'')+'">'+t2+'</div>';
  const bw=el('div','btns');
  btns.forEach(b2=>{
    const bt=el('button'); bt.textContent=b2.label; if(b2.go) bt.className='go';
    bt.onclick=ev=>b2.fn(ev); bw.appendChild(bt);
  });
  d.appendChild(bw); host.appendChild(d);
  return d;
}
function showRoster(){
  issueSheet('奉仕者の名簿（ここで直してスプレッドシートに保存できます）',(host,again)=>{
    const info=el('div','sub'); info.style.margin='0 0 8px';
    info.innerHTML='直したら下の<b>「名簿を保存」</b>を押してください。スプレッドシートの「名簿」タブに書き込みます。';
    host.appendChild(info);
    const day=state.day;
    const sel=el('div','tmsel');
    ['すべて'].concat(TMS).forEach(tm=>{
      const b2=el('button'); b2.textContent=tm;
      b2.setAttribute('aria-pressed', (state.rosterTM||'すべて')===tm);
      b2.onclick=()=>{ state.rosterTM=tm; again(); };
      sel.appendChild(b2);
    });
    host.appendChild(sel);
    const note=el('div','sub'); note.style.margin='0 0 8px';
    note.textContent=DAYS.find(d=>d.id===day).label+'の奉仕可能な時間を編集できます（日付タブで切替）';
    host.appendChild(note);
    PEOPLE.forEach(p=>{
      if(state.rosterTM&&state.rosterTM!=='すべて'&&p.tm!==state.rosterTM) return;
      const w=(p.avail&&p.avail[day])?p.avail[day]:null;
      const busy=personBlocks(p.id).filter(b=>dayOfT(b.t).id===day);
      const d=el('div','isr');
      d.innerHTML='<div class="t1">'+esc(p.name)+'</div>'
        +'<div class="t2">'+(busy.length?busy.length+'件 / '+durTx(busy.reduce((a,b)=>a+b.dur,0)):'この日はまだ予定なし')
        +'　車の座席 '+(p.seats||0)+'</div>';
      const row=el('div'); row.style.cssText='display:flex;gap:6px;flex-wrap:wrap;align-items:center';
      const tmS=el('select'); tmS.style.cssText='border:1px solid var(--rule);border-radius:3px;padding:4px 6px;font-size:12px';
      tmS.innerHTML='<option value="">TM未設定</option>'+TMS.map(t=>'<option'+(p.tm===t?' selected':'')+'>'+esc(t)+'</option>').join('');
      tmS.onchange=()=>{ p.tm=tmS.value||null; saveSoon(); };
      const f=el('input'); f.type='time'; f.step='300'; f.value=w?hhmm(w[0]):'';
      const t=el('input'); t.type='time'; t.step='300'; t.value=w?hhmm(w[1]):'';
      [f,t].forEach(x=>{ x.style.cssText='border:1px solid var(--rule);border-radius:3px;padding:4px 6px;font-family:var(--font-mono);font-size:12px'; });
      const save=()=>{
        if(f.value&&t.value&&mins(t.value)>mins(f.value)){ p.avail=p.avail||{}; p.avail[day]=[mins(f.value),mins(t.value)]; }
        else if(!f.value&&!t.value&&p.avail){ delete p.avail[day]; }
        again();
      };
      const saveAv=()=>{
        if(f.value&&t.value&&mins(t.value)>mins(f.value)){ p.avail=p.avail||{}; p.avail[day]=[mins(f.value),mins(t.value)]; }
        else { if(p.avail) delete p.avail[day]; }
        renderRail(); saveSoon();
      };
      f.onchange=saveAv; t.onchange=saveAv;
      const st=el('input'); st.type='number'; st.min='0'; st.max='9'; st.value=p.seats||0;
      st.style.cssText='width:52px;border:1px solid var(--rule);border-radius:3px;padding:4px;text-align:center;font-family:var(--font-mono)';
      st.onchange=()=>{ p.seats=Math.max(0,parseInt(st.value||'0',10)); saveSoon(); };
      const lb=x=>{ const s2=el('span'); s2.style.cssText='font-size:11px;color:var(--ink-soft)'; s2.textContent=x; return s2; };
      const del=el('button'); del.textContent='×'; del.title='この人を名簿から消す';
      del.style.cssText='margin-left:auto;border:1px solid #E2B4B0;background:#fff;color:var(--alert);'
        +'border-radius:3px;width:26px;height:26px;cursor:pointer';
      del.onclick=()=>{
        const used=BLOCKS.filter(b=>b.staff.indexOf(p.id)>=0).length+PSHIFTS.filter(x=>x.pid===p.id).length;
        if(used&&!confirm(p.name+' は'+used+'件に入っています。消しますか？')) return;
        PEOPLE=PEOPLE.filter(x=>x.id!==p.id);
        BLOCKS.forEach(b=>{ b.staff=b.staff.filter(x=>x!==p.id); });
        PSHIFTS=PSHIFTS.filter(x=>x.pid!==p.id);
        saveSoon(); renderAll(); again();
      };
      row.append(tmS, lb('奉仕可能'), f, lb('〜'), t, lb('座席'), st, del);
      d.appendChild(row);
      host.appendChild(d);
    });
    const sv=el('button','btn'); sv.textContent='☁ 名簿を保存';
    sv.style.cssText='border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:3px;'
      +'padding:8px 12px;font-size:12.5px;cursor:pointer;margin-right:8px';
    sv.onclick=()=>{ saveRosterToSheet(sv); };
    host.appendChild(sv);
    const add=el('button','btn'); add.textContent='＋ 奉仕者を追加';
    add.style.cssText='border:1px dashed var(--rule-strong);background:#fff;border-radius:3px;padding:8px 12px;cursor:pointer;font-size:12.5px';
    add.style.cssText='border:1px dashed var(--rule-strong);background:#fff;border-radius:3px;'
      +'padding:8px 12px;cursor:pointer;font-size:12.5px';
    add.onclick=()=>{
      ask('奉仕者を追加',[{label:'名前',value:'',ph:'例：山田 太郎'},{label:'会衆',value:'',ph:'例：新川会衆'}],v=>{
        const p={id:uid('p'), name:v[0], cong:v[1]||'', tm:(state.rosterTM&&state.rosterTM!=='すべて')?state.rosterTM:null, seats:0, avail:{}};
        PEOPLE.push(p); saveSoon(); again();
      });
    };
    host.appendChild(add);
  });
}
function showFootIssues(){

    list.forEach(x=>{
      const p=getWho(x.pid), b=x.b, f=x.f, hw=getHow(b.howId);
      const t1=esc(p.name)+'　'+hhmmT(b.t)+'–'+hhmmT(b.t+b.dur)+'　'+esc(hw?hw.name:'')+'（'+esc(b.place||'場所未設定')+'）';
      const t2=f.kind==='first'?'この日の最初。来場の手段が未定':('直前は'+esc(f.from)+'　移動'+f.need+'分必要／空き'+f.gap+'分');

function showClashIssues(){
  issueSheet('担当がかぶっているところ',(host,again)=>{
    const seen={}, rows=[];
    BLOCKS.forEach(b=>{
      conflictsOf(b).forEach(o=>{
        const key=[b.id,o.id].sort().join('|');
        if(seen[key]) return; seen[key]=1;
        b.staff.filter(p=>o.staff.indexOf(p)>=0).forEach(pid=>rows.push({pid:pid,a:b,c:o}));
      });
    });
    if(!rows.length){ host.innerHTML='<p style="font-size:13px">かぶりはありません。</p>'; return; }
    rows.forEach(r=>{
      const p=getWho(r.pid), ha=getHow(r.a.howId), hc=getHow(r.c.howId);
      const la=LANES.find(l=>l.id===r.a.laneId), lc=LANES.find(l=>l.id===r.c.laneId);
      issueRow(host, esc(p.name)+'　が同じ時間に2つ',
        hhmmT(r.a.t)+'–'+hhmmT(r.a.t+r.a.dur)+' '+esc(ha?ha.name:'')+'（'+esc(la?la.name:'')+'）<br>'
        +hhmmT(r.c.t)+'–'+hhmmT(r.c.t+r.c.dur)+' '+esc(hc?hc.name:'')+'（'+esc(lc?lc.name:'')+'）', true,
        [{label:'前者から外す', fn:()=>{ r.a.staff=r.a.staff.filter(v=>v!==r.pid); again(); }},
         {label:'後者から外す', fn:()=>{ r.c.staff=r.c.staff.filter(v=>v!==r.pid); again(); }}]);
    });
  });
}

function bigSheet(title, innerHTML, onOk, okLabel){
  const scrim=el('div','scrim'), box=el('div','sheet wide');
  box.innerHTML='<h3>'+esc(title)+'</h3><div class="in">'+innerHTML+'</div>'
    +'<div class="acts"><button type="button" id="bs-no">閉じる</button>'
    +'<button type="button" class="go" id="bs-ok">'+esc(okLabel||'決定')+'</button></div>';
  scrim.appendChild(box); document.body.appendChild(scrim);
  const close=()=>scrim.remove();
  box.querySelector('#bs-no').onclick=close;
  box.querySelector('#bs-ok').onclick=()=>{ onOk(box); close(); };
  scrim.addEventListener('click',ev=>{ if(ev.target===scrim) close(); });

/* ============================================================
   自動保存（このブラウザに保存。再読み込みしても消えない）
   ============================================================ */
var SAVE_KEY='koutei_board_v1';
var saveTimer=null;
function saveBoard(){
  try{
    var data={
      v:1, at:new Date().toISOString(),
      LANES:LANES, CHAINS:CHAINS, BLOCKS:BLOCKS, PSHIFTS:PSHIFTS,
      HOWS:HOWS, PLACES:PLACES, TEMPLATES:TEMPLATES, POS:POS,
      day:state.day, view:state.view, ppm:state.ppm
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    var el2=$('#saveState');
    if(el2){ el2.textContent='保存 '+hhmm(new Date().getHours()*60+new Date().getMinutes()); el2.dataset.state='ok'; }
  }catch(e){}
}
function saveSoon(){ if(saveTimer) clearTimeout(saveTimer); saveTimer=setTimeout(saveBoard,600); }
function restoreBoard(){
  try{
    var raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    var d=JSON.parse(raw);
    if(!d||d.v!==1) return false;
    if(d.LANES&&d.LANES.length) LANES=d.LANES;
    if(d.CHAINS) CHAINS=d.CHAINS;
    if(d.BLOCKS) BLOCKS=d.BLOCKS;
    if(d.PSHIFTS) PSHIFTS=d.PSHIFTS;
    if(d.HOWS&&d.HOWS.length) HOWS=d.HOWS;
    if(d.PLACES&&d.PLACES.length) PLACES=d.PLACES;
    if(d.TEMPLATES&&d.TEMPLATES.length) TEMPLATES=d.TEMPLATES;
    if(d.POS) POS=d.POS;
    if(d.day) state.day=d.day;
    if(d.view) state.view=d.view;
    if(d.ppm) state.ppm=d.ppm;
    return true;
  }catch(e){ return false; }
}
function clearBoard(){
  if(!confirm('この端末に保存した工程を全部消します。よろしいですか？')) return;
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  location.reload();
}

    const av={};
    Object.keys(p.avail||{}).forEach(function(k){
      const w=p.avail[k]; if(w&&w.length===2) av[k]=hhmmOf(w[0])+'-'+hhmmOf(w[1]);
    });
    return {name:p.name, cong:p.cong||'', tm:p.tm||'', seats:p.seats||0, avail:av};
  });
  if(btn){ btn.disabled=true; btn.textContent='保存中…'; }
  postAPI({action:'saveRoster', roster:list})
    .then(function(js){
      if(btn){ btn.disabled=false; btn.textContent='☁ 名簿を保存'; }
      toast(js.ok?('名簿を保存しました（'+js.saved+'名）'):('保存できません: '+(js.error||'')));
    })
    .catch(function(e){
      if(btn){ btn.disabled=false; btn.textContent='☁ 名簿を保存'; }
      toast('保存できません: '+e);
    });
}
function planPayload(){
  const rows=[];
  BLOCKS.slice().sort(function(a,b){return a.t-b.t;}).forEach(function(b){
    const h=getHow(b.howId), ln=LANES.find(function(l){return l.id===b.laneId;}), ch=getChain(b.chainId);
    const cargo=[];
    (b.load||[]).forEach(function(x){ const l=lineOf(x.d,x.l); if(l) cargo.push('積 '+l.name+'×'+x.q); });
    (b.drop||[]).forEach(function(x){ const l=lineOf(x.d,x.l); if(l) cargo.push('降 '+l.name+'×'+x.q); });
    rows.push({
      day:dayOfT(b.t).label, start:hhmmT(b.t), end:hhmmT(b.t+b.dur),
      vehicle:ln?ln.name:'', how:h?h.name:'', place:b.place||'',
      staff:b.staff.map(function(s){const p=getWho(s);return p?p.name:'';}).join('・'),
      cargo:cargo.join(' / '), tm:blkTM(b)
    });
  });
  return {
    v:1, savedAt:new Date().toISOString(),
    LANES:LANES, CHAINS:CHAINS, BLOCKS:BLOCKS, PSHIFTS:PSHIFTS,
    HOWS:HOWS.filter(function(h){return h.custom;}), PLACES:PLACES, rows:rows
  };
}
function savePlanToSheet(){
  const st=$('#saveState');
  st.textContent='保存中…';
  postAPI({action:'savePlan', plan:planPayload()})
    .then(function(js){
      if(js.ok){ st.textContent='シート保存ずみ'; st.dataset.state='ok';
        toast('スプレッドシートに保存しました（'+js.saved+'件）'); }
      else { st.textContent='保存できず'; st.dataset.state='ng'; toast('保存できません: '+(js.error||'')); }
    })
    .catch(function(e){ st.textContent='保存できず'; st.dataset.state='ng'; toast('保存できません: '+e); });
}
function applyPlan(p){
  if(!p) return false;
  if(p.LANES&&p.LANES.length) LANES=p.LANES;
  if(p.CHAINS) CHAINS=p.CHAINS;
  if(p.BLOCKS) BLOCKS=p.BLOCKS;
  if(p.PSHIFTS) PSHIFTS=p.PSHIFTS;
  if(p.PLACES&&p.PLACES.length) PLACES=p.PLACES;
  (p.HOWS||[]).forEach(function(h){ if(!getHow(h.id)) HOWS.push(h); });
  return true;
}

/* ============================================================
   実データの取込（CO-31 と 名簿）
   ============================================================ */
var API_URL='https://script.google.com/macros/s/AKfycbw41gYVPhGvNCx5cQ-6XP9_j0qu7nxkTUdshD9hegrsLqCzjwoF504TyY-1dAkdAkTJ-A/exec';

function dayLabelOf(id){
  var d=DAYS.filter(function(x){return x.id===id;})[0];
  return d?d.label.split(' ')[0]:(id||'');
}
function doTimeLabel(d){
  if(!d) return '';
  if(d.at) return d.at+(d.atEnd?'〜'+d.atEnd:'')+(d.after?'以降':'');
  if(d.period&&d.period!=='指定なし') return d.period+(d.timeText&&d.timeText!=='なし'?'（'+d.timeText+'）':'');
  return '指定なし';
}
function applyCO31(list){
  if(!list||!list.length) return 0;
  DOS=list.map(function(r,i){
    var lines=(r.lines||[]).map(function(l,j){
      return {id:'co'+(r.no||i)+'_'+j, name:l.name, qty:l.qty||1, size:l.size||''};
    });
    return {
      id:'co'+(r.no||i),
      no:r.no||'', dept:r.dept||'',
      day:r.day||'0827',
      at:r.at||'', period:r.period||'', atEnd:r.atEnd||'', after:!!r.after, timeText:r.timeText||'',
      whenRaw:r.whenRaw||'',
      from:(r.fromVenue||r.from||''), fromText:(r.from||''),
      to:(r.toVenue||r.to||''),     toDetail:(r.toDetail||r.to||''),
      note:r.note||'',
      items:lines.map(function(l){return l.name+'×'+l.qty;}).join('　/　'),
      lines:lines
    };
  });
  return DOS.length;
}
function applyRoster(list){
  if(!list||!list.length) return 0;
  PEOPLE=list.map(function(r,i){
    var av={};
    var src=r.availMin||{};
    Object.keys(src).forEach(function(k){ av[k]=[src[k][0],src[k][1]]; });
    return {
      id:'p'+i, name:r.name, cong:r.cong||'',
      tm:(r.tm||'').replace(/\s/g,'')||null,
      seats:r.seats||0, avail:av
    };
  });
  return PEOPLE.length;
}
function afterLoad(js){
  var n1=applyCO31(js.co31), n2=applyRoster(js.roster);
  if(!restored && js.plan){ applyPlan(js.plan); }
  /* 古いデプロイだと配送先が部門名のまま届く（部門の文字が入っていたら警告） */
  var oldish=(js.co31||[]).filter(function(r){ return !r.whenRaw && !r.toVenue; }).length;
  if(n1&&oldish>n1*0.5){
    setTimeout(function(){
      toast('GASのデプロイが古いようです。デプロイを管理→新バージョン→デプロイ をしてから「⟳取込」を押してください。');
    },1200);
  }
  var st=$('#dataState');
  st.textContent='実データ CO-31 '+n1+'件 / 名簿 '+n2+'名';
  st.dataset.state='live';
  /* 場所を実データから足す */
  DOS.forEach(function(d){ if(d.from) ensurePlace(d.from); if(d.to) ensurePlace(d.to); });
  state.check=null; state.panel=null; state.sel=null;
  renderAll(); saveBoard();
  var msg=[];
  if(js.co31Error) msg.push('CO-31: '+js.co31Error);
  if(js.rosterError) msg.push('名簿: '+js.rosterError);
  if(!n2) msg.push('名簿が空です（名簿タブを埋めると人が入れ替わります）');
  toast(msg.length?msg.join(' / '):('読み込みました。CO-31 '+n1+'件・名簿 '+n2+'名'));
}
function loadLive(){
  var st=$('#dataState');
  st.textContent='読み込み中…'; st.dataset.state='';
  fetch(API_URL+'?action=all', {method:'GET'})
    .then(function(r){ return r.json(); })
    .then(function(js){ afterLoad(js); })
    .catch(function(e){
      st.textContent='取込できず'; st.dataset.state='ng';
      pasteSheet(String(e));
    });
}
function pasteSheet(err){
  var html='<p style="font-size:12.5px;margin:0 0 8px">自動で読み込めませんでした'
    +(err?'（'+esc(err)+'）':'')+'。<br>下のURLをブラウザで開き、出てきた文字を全部コピーして貼り付けてください。</p>'
    +'<p style="font-size:11px;word-break:break-all;background:#fff;border:1px solid var(--rule);padding:6px">'
    +esc(API_URL)+'?action=all</p>'
    +'<textarea class="ta" id="pj" placeholder="ここに貼り付け"></textarea>';
  bigSheet('実データの取込', html, function(box){
    try{
      var js=JSON.parse(box.querySelector('#pj').value);
      afterLoad(js);
    }catch(e2){ toast('読み取れませんでした: '+e2); }
  },'取り込む');
}
$('#btnLoad').addEventListener('click',loadLive);

/* ---------- init ---------- */
var restored=restoreBoard();
renderDays(); renderViews(); renderTMFilter(); setZoom(state.ppm); renderAll();
$('#btnClear').addEventListener('click',clearBoard);
$('#btnSave').addEventListener('click',savePlanToSheet);
if(restored) setTimeout(function(){ toast('前回の続きを開きました。'); },600);
setTimeout(loadLive,300);
scrollToDay(state.day,false);
</script>

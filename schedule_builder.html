<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>工程ボード v40（モック） 2026宜野湾大会</title>
<style>
  :root{
    --ink:#16222E; --ink-soft:#43566A; --canvas:#EDEEE9; --panel:#1D2C3A;
    --rule:#C7CBC2; --rule-strong:#A9AEA3; --paper:#FBFBF8;
    --do:#B4531B; --how:#1C6F62; --who:#54479A; --alert:#BE2F27; --ok:#2E7D4F;
    --radius:3px; --lane-h:84px; --col-w:152px; --detail-w:318px; --ruler-h:42px;
    --font-jp:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Yu Gothic",Meiryo,system-ui,sans-serif;
    --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font-jp);font-size:14px;
    line-height:1.5;-webkit-text-size-adjust:100%;overscroll-behavior:none}
  button,select,input,textarea{font-family:inherit}
  :focus-visible{outline:2px solid var(--who);outline-offset:2px}

  .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:9px 16px;
    background:var(--panel);color:#EAEDE8;border-bottom:3px solid var(--ink)}
  .brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
  .brand b{font-size:15px;letter-spacing:.08em;font-weight:600}
  .brand span{font-family:var(--font-mono);font-size:11px;color:#93A6B4;letter-spacing:.06em}
  .days{display:flex;border:1px solid #3C5266;border-radius:var(--radius);overflow:hidden}
  .days button{background:transparent;border:0;border-right:1px solid #3C5266;padding:6px 10px;
    font-family:var(--font-mono);font-size:12px;cursor:pointer;color:#B9C6D0}
  .days button:last-child{border-right:0}
  .days button[aria-pressed="true"]{background:#EAEDE8;color:var(--panel);font-weight:700}
  .tool{display:flex;align-items:center;gap:6px}
  .tool button{background:#2E4356;border:1px solid #3C5266;border-radius:var(--radius);
    padding:6px 10px;cursor:pointer;font-size:12px;color:#EAEDE8}
  .tool button:hover{background:#375066}
  .zoom{font-family:var(--font-mono);font-size:12px;color:#93A6B4;min-width:44px;text-align:center}
  .flag{font-family:var(--font-mono);font-size:12px;padding:5px 10px;border-radius:var(--radius);
    background:#2E4356;border:1px solid #3C5266}
  .flag{cursor:pointer}
  .flag[data-state="bad"]{background:var(--alert);border-color:var(--alert);color:#fff;font-weight:700}

  .app{display:grid;height:calc(100% - 51px);
    grid-template-columns:var(--detail-w) 1fr;
    grid-template-rows:minmax(200px,30vh) 1fr}
  .detail{grid-column:1;grid-row:1 / -1;background:var(--paper);border-right:2px solid var(--ink);
    display:flex;flex-direction:column;overflow:hidden}
  .rails{grid-column:2;grid-row:1;display:grid;grid-template-columns:repeat(3,1fr);overflow:hidden;
    border-bottom:3px solid var(--ink)}
  .board{grid-column:2;grid-row:2;display:grid;grid-template-columns:var(--col-w) 1fr;overflow:hidden}

  .rail{background:var(--paper);border-right:1px solid var(--rule);overflow-y:auto;
    -webkit-overflow-scrolling:touch}
  .rail:last-child{border-right:0}
  .rail h2{margin:0;padding:8px 11px 6px;font-size:11px;letter-spacing:.12em;font-weight:700;
    position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--rule);z-index:2;
    display:flex;align-items:center;gap:7px}
  .tag{width:9px;height:9px;border-radius:50%;flex:none}
  .tag.do{background:var(--do)} .tag.how{background:var(--how)} .tag.who{background:var(--who)}
  .h-note{font-family:var(--font-mono);font-size:10px;color:var(--ink-soft);font-weight:400;margin-left:auto;letter-spacing:0}
  .chips{padding:8px 9px 14px;display:flex;flex-direction:column;gap:6px}
  .chips.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:start}

  .chip{border:1px solid var(--rule);border-left:4px solid var(--rule-strong);background:#fff;
    border-radius:var(--radius);padding:7px 9px;cursor:grab;touch-action:pan-y;
    user-select:none;-webkit-user-select:none}
  .chip:active{cursor:grabbing}
  .chip.do{border-left-color:var(--do)}
  .chip.how{border-left-color:var(--how);padding:8px 5px;text-align:center;position:relative}
  .chip.how .howdel{position:absolute;right:2px;top:2px;width:18px;height:18px;border-radius:50%;
    border:1px solid var(--rule);background:#fff;color:var(--alert);font-size:11px;line-height:15px;
    padding:0;cursor:pointer}
  .chip.how .howdel:hover{background:var(--alert);color:#fff;border-color:var(--alert)}
  .chip.who{border-left-color:var(--who)}
  .chip .t{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft)}
  .chip .m{font-size:12.5px;font-weight:600;margin-top:1px}
  .chip .s{font-size:11px;color:var(--ink-soft);margin-top:2px}
  .chip.how .ic{font-size:18px;line-height:1.1}
  .chip.how .m{font-size:11px;margin-top:3px}
  .chip.how svg{display:block;margin:0 auto;height:20px;width:34px}
  .chip[data-used="1"]{opacity:.5}
  /* ④ この時間には入れない人 */
  .chip.tpl{border-left-color:var(--ink);background:#F3F4EF}
  .chip.crew{border-left-color:var(--who);background:#F3F1FB}
  .minilab{font-size:10px;letter-spacing:.1em;color:var(--ink-soft);font-weight:700;margin:-2px 0 2px}
  /* 場所ビュー */
  .lane.prow{background-color:#F8F8F4}
  .tri{vertical-align:middle;margin-right:4px}
  .lhimg{display:flex;align-items:center;gap:4px}
  .lhimg img{height:22px}
  .mvb{position:absolute;z-index:6;transform:translate(-50%,-50%);border-radius:13px;
    border:1px solid var(--rule-strong);background:#fff;font-size:11px;padding:3px 8px;cursor:pointer;
    white-space:nowrap;box-shadow:0 1px 3px rgba(22,34,46,.18)}
  .mvb.set{border-color:#8FA9C6;color:#274766;background:#EEF3FA}
  .mvb.bad{border-color:var(--alert);color:#8E241E;font-weight:700;background:#FDF1F0}
  .tblk{position:absolute;height:62px;border-radius:4px;border:1px solid var(--rule-strong);
    border-left:4px solid var(--do);background:#fff;overflow:hidden;cursor:pointer;z-index:3;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px 4px}
  .tblk img{height:24px;flex:none;pointer-events:none}
  .tblk{touch-action:none;cursor:grab}
  .tblk:active{cursor:grabbing}
  .tblk .h{position:absolute;top:0;bottom:0;width:14px;cursor:ew-resize;touch-action:none}
  .tblk .h.l{left:0} .tblk .h.r{right:0}
  .tblk .h::after{content:"";position:absolute;top:10px;bottom:10px;width:2px;background:var(--rule-strong)}
  .tblk .h.l::after{left:4px} .tblk .h.r::after{right:4px}
  .tblk:hover .h::after{background:var(--ink-soft)}
  .tblk .nm{font-size:10px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:100%}
  .tblk .wk{font-size:10px;color:var(--ink-soft);line-height:1.15;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:100%}
  .tlab{position:absolute;height:62px;font-size:10.5px;white-space:nowrap;z-index:3;
    color:var(--ink);pointer-events:none;padding-left:6px;display:flex;flex-direction:column;justify-content:center}
  .tlab b{font-weight:700}
  .tlab span{color:var(--ink-soft)}
  .tblk[data-bad="1"]{border-color:var(--alert);background:#FDF1F0}
  .ps{position:absolute;height:26px;border-radius:14px;border:1px solid var(--who);
    background:#F5F3FC;color:#3E3277;font-size:11.5px;line-height:26px;padding:0 10px;white-space:nowrap;
    overflow:hidden;cursor:grab;touch-action:none;z-index:4;user-select:none;-webkit-user-select:none}
  .ps[data-bad="1"]{border-color:var(--alert);background:#FDF1F0;color:#8E241E}
  .ps .h{position:absolute;top:0;bottom:0;width:16px;cursor:ew-resize;touch-action:none}
  .ps .h.l{left:0} .ps .h.r{right:0}
  .ps .h::after{content:"";position:absolute;top:7px;bottom:7px;width:2px;background:var(--who);opacity:.5}
  .ps .h.l::after{left:5px} .ps .h.r::after{right:5px}
  .psplus{position:absolute;width:20px;height:20px;border-radius:50%;border:1px dashed var(--who);
    background:#fff;color:var(--who);font-size:12px;line-height:19px;text-align:center;cursor:pointer;z-index:5;padding:0}
  .psplus:hover{border-style:solid;background:#F2EEFB}
  .mv{position:absolute;height:16px;border-radius:9px;border:1px solid var(--rule-strong);
    background:repeating-linear-gradient(45deg,#DEE1DA 0 5px,#EBEEE7 5px 10px);font-size:9.5px;line-height:16px;
    padding:0 7px;white-space:nowrap;overflow:hidden;cursor:pointer;z-index:4;color:var(--ink-soft)}
  .mv.bad{border-color:var(--alert);color:#8E241E;font-weight:700;
    background:repeating-linear-gradient(45deg,#F5D5D2 0 5px,#FCEAE8 5px 10px)}
  .mv.set{background:#EEF3FA;border-color:#8FA9C6;color:#274766}
  .addp{position:absolute;right:8px;top:6px;border:1px dashed var(--rule-strong);background:#fff;
    border-radius:3px;font-size:10.5px;padding:3px 7px;cursor:pointer;color:var(--ink-soft);z-index:6}
  .stopr{display:flex;gap:6px;align-items:center;padding:5px 6px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
  .stopr:last-child{border-bottom:0}
  .stopr select{border:1px solid var(--rule);border-radius:3px;padding:4px 5px;font-size:12px;flex:1;min-width:110px}
  .stopr .at{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft);width:42px}
  .stopr .pd{display:flex;gap:4px;flex-wrap:wrap;flex-basis:100%}
  .pd .tagp,.pd .tagd{display:inline-flex;align-items:center;gap:4px;border-radius:3px;padding:2px 5px;font-size:11px;border:1px solid}
  .pd .tagp{border-color:var(--ok);color:#256B44;background:#F1F7F3}
  .pd .tagd{border-color:var(--do);color:#8A3F14;background:#FBF2EA}
  .pd button{border:0;background:transparent;cursor:pointer;font-size:12px;padding:0 1px;color:inherit}
  .footbtn{border:1px solid var(--rule-strong);background:#fff;border-radius:3px;padding:4px 7px;
    font-size:11px;cursor:pointer;white-space:nowrap}
  .footbtn:hover{border-color:var(--ink)}
  .footbtn.go{border-color:var(--how);color:var(--how)}
  .footrow{display:flex;flex-wrap:wrap;gap:5px;margin:3px 0 7px}
  .footst{font-size:11px;color:var(--ink-soft)}
  .footst.bad{color:var(--alert);font-weight:700}
  .move{position:absolute;top:calc(50% - 9px);height:18px;z-index:2;pointer-events:none;overflow:hidden;
    white-space:nowrap;text-align:center;font-size:9.5px;line-height:16px;color:var(--ink-soft);
    border:1px solid var(--rule-strong);border-radius:9px;
    background:repeating-linear-gradient(45deg,#DEE1DA 0 5px,#EBEEE7 5px 10px)}
  .move.short{color:#8E241E;font-weight:700;border-color:var(--alert);
    background:repeating-linear-gradient(45deg,#F5D5D2 0 5px,#FCEAE8 5px 10px)}
  .chip.crew .ng,.chip.who .ng{display:none;font-size:10px;font-weight:700;color:var(--alert);margin-left:5px}
  .chip.who[data-ng],.chip.crew[data-ng]{border-color:var(--alert);border-left-color:var(--alert);background:#FDF1F0}
  .chip.who[data-ng] .m,.chip.crew[data-ng] .m{color:#8E241E}
  .chip.who[data-ng] .free{color:#8E241E;opacity:.75}
  .chip.who[data-ng] .ng,.chip.crew[data-ng] .ng{display:inline}
  .addbtn{width:100%;border:1px dashed var(--rule-strong);background:transparent;border-radius:var(--radius);
    padding:8px;cursor:pointer;font-size:12px;color:var(--ink-soft)}
  .addbtn:hover{background:#F2F2ED;color:var(--ink)}
  .chips.g2 .addbtn{grid-column:1/-1}
  .free{font-family:var(--font-mono);font-size:10px;color:var(--ok)}
  .free[data-full="1"]{color:var(--alert)}

  .lanecol{border-right:2px solid var(--rule-strong);background:#F4F5F1;overflow:hidden;position:relative}
  .scroller{overflow:auto;-webkit-overflow-scrolling:touch;position:relative}
  .ruler-pad{height:var(--ruler-h);border-bottom:1px solid var(--rule-strong);display:flex;align-items:center;
    justify-content:space-between;padding:0 7px 0 10px;gap:6px;position:sticky;top:0;background:#F4F5F1;z-index:3}
  .ruler-pad span{font-size:10.5px;color:var(--ink-soft);line-height:1.15}
  .ruler-pad button{border:1px solid var(--rule-strong);background:#fff;border-radius:var(--radius);
    font-size:15px;width:24px;height:24px;cursor:pointer;padding:0;color:var(--ink-soft);flex:none}
  .ruler{height:var(--ruler-h);position:sticky;top:0;z-index:5;background:var(--canvas);
    border-bottom:1px solid var(--rule-strong)}
  .ruler .dayseg{position:absolute;top:0;height:19px;line-height:19px;font-size:11px;font-weight:700;
    border-left:2px solid var(--ink);padding-left:6px;background:#E3E6DF;white-space:nowrap;overflow:hidden}
  .ruler .dayseg[data-alt="1"]{background:#D9DDD4}
  .ruler i{position:absolute;top:19px;bottom:0;border-left:1px solid var(--rule);font-style:normal}
  .ruler i.hr{border-left-color:var(--rule-strong)}
  .ruler i.day{border-left:2px solid var(--ink)}
  .ruler i.hr::after{content:attr(data-l);position:absolute;left:4px;top:4px;
    font-family:var(--font-mono);font-size:11px;color:var(--ink-soft)}

  .laneh{height:var(--lane-h);border-bottom:1px solid var(--rule);padding:6px 8px 5px;
    display:flex;flex-direction:column;gap:3px}
  .laneh input{border:1px solid transparent;background:transparent;font-size:13px;font-weight:600;
    width:100%;padding:2px 4px;border-radius:var(--radius);color:var(--ink)}
  .laneh input:hover{border-color:var(--rule)}
  .laneh input:focus{background:#fff;border-color:var(--who);outline:none}
  .laneh select{border:1px solid var(--rule);background:#fff;border-radius:var(--radius);
    font-size:10.5px;color:var(--ink-soft);padding:1px 3px;width:100%}
  .laneh .ops{display:flex;gap:4px;margin-top:auto}
  .laneh .ops button{border:1px solid var(--rule);background:#fff;border-radius:var(--radius);
    width:26px;height:22px;font-size:10px;cursor:pointer;color:var(--ink-soft);padding:0}
  .laneh.empty{background:repeating-linear-gradient(45deg,#EFF0EB 0 8px,#F4F5F1 8px 16px)}

  .lanes{position:relative}
  .lane{height:var(--lane-h);border-bottom:1px solid var(--rule);position:relative;
    background-image:repeating-linear-gradient(to right,transparent 0,transparent calc(var(--hr) - 1px),var(--rule) calc(var(--hr) - 1px),var(--rule) var(--hr))}
  .lane.hot{background-color:#E3E8DF}
  #shade{position:absolute;left:0;top:0;pointer-events:none;z-index:1}
  #shade .night{position:absolute;top:0;height:100%;background:rgba(22,34,46,.07)}
  #wires{pointer-events:none}
  #wires .seg{cursor:grab}
  #wires .seg .hit{stroke:rgba(0,0,0,0);stroke-width:20;fill:none;pointer-events:stroke}
  #wires .pt{pointer-events:all;cursor:ns-resize}
  #wires .pt .ring{fill:rgba(0,0,0,0);pointer-events:all}
  #wires .knobg{pointer-events:all;cursor:pointer}
  #wires text{font-family:var(--font-jp);font-size:10.5px;fill:#43566A}
  #wires text.big{font-size:11px;fill:#16222E;font-weight:700}
  #shade .okband{position:absolute;background:rgba(46,125,79,.10);border-top:2px solid rgba(46,125,79,.30)}
  #shade .dayline{position:absolute;top:0;height:100%;border-left:2px solid var(--ink);opacity:.5}
  #wires{position:absolute;left:0;top:0;pointer-events:none;z-index:2;overflow:visible}

  .block{position:absolute;top:7px;height:calc(var(--lane-h) - 20px);z-index:3;background:#fff;
    border:1px solid var(--rule-strong);border-left:5px solid var(--do);border-radius:var(--radius);
    padding:3px 7px 3px 8px;overflow:hidden;cursor:grab;touch-action:none;
    user-select:none;-webkit-user-select:none;box-shadow:0 1px 0 rgba(22,34,46,.10)}
  .block:active{cursor:grabbing}
  .block .bt{font-family:var(--font-mono);font-size:10px;color:var(--ink-soft);white-space:nowrap}
  .block .bt b{color:var(--ink);font-weight:700}
  .block .bm{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    display:flex;align-items:center;gap:5px;line-height:1.25}
  .block .bm .big{font-size:17px;line-height:1}
  .block .bm svg{height:17px;width:28px;flex:none}
  .block .bs{font-size:11px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .block .bs b{font-weight:600;color:var(--who)}
  .block .hand{position:absolute;top:0;bottom:0;width:22px;cursor:ew-resize;touch-action:none;z-index:5}
  .block .hand.l{left:-6px} .block .hand.r{right:-6px}
  .block .hand::after{content:"";position:absolute;top:50%;transform:translateY(-50%);
    width:3px;height:20px;border-radius:2px;background:var(--rule-strong)}
  .block .hand.l::after{left:7px} .block .hand.r::after{right:7px}
  .block:hover .hand::after{background:var(--ink-soft)}
  .block .link{position:absolute;right:3px;top:2px;width:17px;height:17px;border-radius:50%;
    border:1px solid var(--rule-strong);background:#fff;color:var(--who);font-size:10px;line-height:15px;
    text-align:center;z-index:6;cursor:crosshair;touch-action:none}
  .block .link:hover{border-color:var(--who);background:#F0EDF8}
  .block.tgt{box-shadow:0 0 0 3px var(--who)}
  .block[data-conflict="1"]{border-color:var(--alert);background:#FDF1F0}
  .block[data-linked="1"]{box-shadow:0 0 0 2px var(--who)}
  .block[data-selected="1"]{box-shadow:0 0 0 2px var(--ink)}
  .block[data-multi="1"]{box-shadow:0 0 0 3px var(--alert)}
  #multibar{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:145;display:none;
    background:var(--ink);color:#F2F4F0;border-radius:var(--radius);padding:8px 10px;
    box-shadow:0 6px 20px rgba(0,0,0,.3);align-items:center;gap:8px;font-size:12.5px}
  #multibar.on{display:flex}
  #multibar button{border:1px solid #46596B;background:#2E4356;color:#EAEDE8;border-radius:3px;
    padding:6px 10px;font-size:12px;cursor:pointer}
  #multibar button.del{background:var(--alert);border-color:var(--alert);font-weight:700}
  .block[data-outside="1"]::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(45deg,rgba(190,47,39,.10) 0 6px,transparent 6px 12px)}

  .block.truck{padding-right:34px}
  .block.truck .cab{position:absolute;right:4px;bottom:4px;width:28px;height:30px;pointer-events:none}
  .bed{position:absolute;left:8px;right:36px;top:16px;bottom:4px;border:1px dashed var(--rule-strong);
    border-radius:2px;padding:1px 2px;display:flex;flex-direction:column;gap:1px;overflow:hidden;background:#FCFBF6}
  .bed.hot{border-style:solid;border-color:var(--do);background:#FBF0E6}
  .bed .load{font-size:9.5px;line-height:1.25;background:#F1EFE7;border:1px solid #DEDACE;border-radius:2px;
    padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
  .bed .more{font-family:var(--font-mono);font-size:9px;color:var(--ink-soft)}
  .bed .none{font-size:9.5px;color:var(--ink-soft)}

  .rubber{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:135}
  .cargo.hot{border-color:var(--do);background:#FBF0E6}

  .knob{position:absolute;z-index:4;width:26px;height:26px;border-radius:50%;
    border:1px dashed var(--rule-strong);background:#fff;color:var(--ink-soft);font-size:15px;
    line-height:1;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
  .knob:hover,.knob.hot{border-style:solid;border-color:var(--how);color:var(--how);background:#EAF3F1}

  #mindpane{display:none;position:relative;width:2600px;height:1700px;
    background-image:radial-gradient(circle,#DDE0D8 1.2px,transparent 1.2px);background-size:26px 26px}
  #mindpane #mnew,#mindpane #mfit,#mindpane #mreset{position:absolute;top:12px;z-index:5;
    border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:var(--radius);
    padding:8px 12px;font-size:12.5px;cursor:pointer}
  #mindpane #mnew{left:14px}
  #mindpane #mfit{left:130px;background:#fff;color:var(--ink);border-color:var(--rule-strong)}

  var n=String(name).toUpperCase();
  if(n.indexOf('2TU')>=0||n.indexOf('ユニック')>=0) return TRUCKIMG.unic;
  if(n.indexOf('4TW')>=0||n.indexOf('ウィング')>=0||n.indexOf('箱')>=0) return TRUCKIMG.wing;

}

const seatsOf=pid=>{ const p=getWho(pid); return p&&p.seats?p.seats:0; };

function shiftsOf(pid){ return PSHIFTS.filter(s=>s.pid===pid).sort((a,b)=>a.t-b.t); }
function prevShift(s){
  const mine=shiftsOf(s.pid); let pv=null;
  mine.forEach(o=>{ if(o.id!==s.id && o.t+o.dur<=s.t) pv=o; });
  return pv;
}
function shiftClash(s){
  return PSHIFTS.some(o=>o.id!==s.id&&o.pid===s.pid&&o.t<s.t+s.dur&&s.t<o.t+o.dur);
}
function rideGroup(s){
  if(!s.arrive||!s.arrive.driver) return [s];
  return PSHIFTS.filter(o=>o.arrive&&o.arrive.mode===s.arrive.mode&&o.arrive.driver===s.arrive.driver
    && o.place===s.place && Math.abs(o.t-s.t)<=60);
}
function rideCap(s){
  if(!s.arrive) return 99;
  if(s.arrive.mode==='truck') return CAP_TRUCK;
  if(s.arrive.mode==='car') return seatsOf(s.arrive.driver)||5;
  return 99;
}
function capOver(){
  const seen={}, out=[];
  PSHIFTS.forEach(s=>{
    if(!s.arrive||!s.arrive.driver) return;
    const key=s.arrive.mode+'|'+s.arrive.driver+'|'+s.place+'|'+Math.round(s.t/60);
    if(seen[key]) return; seen[key]=1;
    const g=rideGroup(s), cap=rideCap(s);
    const n=g.length+(s.arrive.mode==='car'?1:0);   /* 運転者を足す */
    if(n>cap) out.push({s:s, n:n, cap:cap});
  });
  return out;
}

/* ============================================================
   積載マニフェスト（品目単位）
   b.load=[{d:CO31id,l:品目id,q:数}] 積み込み ／ b.drop=[...] 荷降ろし
   ============================================================ */
function lineOf(did,lid){
  const d=getDo(did); if(!d||!d.lines) return null;
  return d.lines.filter(x=>x.id===lid)[0]||null;
}
function manifestAdd(map,arr,sign){
  (arr||[]).forEach(x=>{
    const k=x.d+'|'+x.l;
    map[k]=(map[k]||0)+sign*x.q;
    if(map[k]<=0) delete map[k];
  });
}
function onboardBefore(b){
  const map={};
  steps(b.chainId).forEach(o=>{
    if(o.id===b.id || o.t>b.t) return;
    manifestAdd(map,o.load,1); manifestAdd(map,o.drop,-1);
  });
  return map;
}
function onboardAfter(b){
  const map=onboardBefore(b);
  manifestAdd(map,b.load,1); manifestAdd(map,b.drop,-1);
  return map;
}
function onboardEnd(chainId){
  const list=steps(chainId);
  return list.length?onboardAfter(list[list.length-1]):{};
}
function mapCount(map){ let n=0; Object.keys(map).forEach(k=>{n+=map[k];}); return n; }
function mapList(map){
  return Object.keys(map).map(k=>{
    const a=k.split('|'), d=getDo(a[0]), l=lineOf(a[0],a[1]);
    return {d:a[0], l:a[1], q:map[k], dLabel:d?doLabel(d):'', name:l?l.name:'（不明）', to:d?d.to:''};
  });
}
function syncChainLoads(c){
  const ids=[];
  BLOCKS.filter(b=>b.chainId===c.id).forEach(b=>{
    (b.load||[]).forEach(x=>{ if(ids.indexOf(x.d)<0) ids.push(x.d); });
  });
  if(ids.length) c.loads=ids;
}

/* ---------- 判定（すべて連続時間で） ---------- */
function availAbs(p){
  const out=[];
  if(p&&p.avail) Object.keys(p.avail).forEach(k=>{
    if(DIDX[k]===undefined) return;
    p.avail[k].forEach(w=>out.push([ABS(k,w[0]),ABS(k,w[1])]));
  });
  return out.sort((a,b)=>a[0]-b[0]);
}
const overlap=(a,b)=>a.t<b.t+b.dur && b.t<a.t+a.dur;
function conflictsOf(b){
  return BLOCKS.filter(o=>o.id!==b.id && o.staff.some(s=>b.staff.includes(s)) && overlap(o,b));
}
function outsideAvail(b){
  return b.staff.filter(sid=>{
    const w=availAbs(getWho(sid));
    if(!w.length) return true;
    return !w.some(x=>b.t>=x[0] && b.t+b.dur<=x[1]);
  });
}
/* 人pidをブロックbに入れられるか */
function whoStatus(pid,b){
  if(!b) return 'ok';
  if(b.staff.includes(pid)) return 'ok';
  const busy=BLOCKS.some(o=>o.id!==b.id && o.staff.includes(pid) && overlap(o,b));
  if(busy) return 'busy';
  const w=availAbs(getWho(pid));
  if(!w.some(x=>b.t>=x[0] && b.t+b.dur<=x[1])) return 'out';
  return 'ok';
}
function freeSlots(pid,dayId){
  const p=getWho(pid);
  const w=((p&&p.avail&&p.avail[dayId])||[]).map(x=>[ABS(dayId,x[0]),ABS(dayId,x[1])]);
  const busy=BLOCKS.filter(b=>b.staff.includes(pid)).map(b=>[b.t,b.t+b.dur]).sort((a,b)=>a[0]-b[0]);
  const out=[];
  w.forEach(win=>{
    let cur=win[0];
    busy.forEach(bz=>{ if(bz[1]<=cur||bz[0]>=win[1]) return; if(bz[0]>cur) out.push([cur,bz[0]]); cur=Math.max(cur,bz[1]); });
    if(cur<win[1]) out.push([cur,win[1]]);
  });
  return out;
}

/* ---------- 入力シート ---------- */
function ask(title, fields, onOk){
  const scrim=el('div','scrim'), sheet=el('div','sheet');
  let html='<h3>'+esc(title)+'</h3><div class="in">';
  fields.forEach((f,i)=>{
    html+='<div class="fld"><label>'+esc(f.label)+'</label>'
       +'<input id="ask-'+i+'" value="'+esc(f.value||'')+'" placeholder="'+esc(f.ph||'')+'"></div>';
    if(f.picks) html+='<div class="picks" data-for="'+i+'">'+f.picks.map(p=>'<button type="button" data-p="'+esc(p)+'">'+p+'</button>').join('')+'</div>';
  });
  html+='</div><div class="acts"><button type="button" id="ask-no">やめる</button><button type="button" class="go" id="ask-ok">決定</button></div>';
  sheet.innerHTML=html; scrim.appendChild(sheet); document.body.appendChild(scrim);
  sheet.querySelectorAll('.picks').forEach(row=>{
    row.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
      sheet.querySelector('#ask-'+row.dataset.for).value=b.dataset.p;
    }));
  });
  const close=()=>{ scrim.remove(); document.removeEventListener('keydown',key); };
  const done=()=>{
    const vals=fields.map((f,i)=>sheet.querySelector('#ask-'+i).value.trim());
    if(!vals[0]){ sheet.querySelector('#ask-0').focus(); return; }
    close(); onOk(vals);
  };
  const key=ev=>{ if(ev.key==='Escape') close(); if(ev.key==='Enter') done(); };
  sheet.querySelector('#ask-ok').addEventListener('click',done);
  sheet.querySelector('#ask-no').addEventListener('click',close);
  scrim.addEventListener('click',ev=>{ if(ev.target===scrim) close(); });
  document.addEventListener('keydown',key);
  setTimeout(()=>sheet.querySelector('#ask-0').focus(),30);
}

/* ④に「この時間は入れない」を出す */
function updateWhoFlags(){
  const b=state.check?getBlk(state.check):null;
  let ng=0;
  document.querySelectorAll('.chip.who').forEach(c=>{
    const st=b?whoStatus(c.dataset.id,b):'ok';
    const badge=c.querySelector('.ng');
    if(st==='ok'){ delete c.dataset.ng; if(badge) badge.textContent=''; }
    else{ c.dataset.ng=st; ng++; if(badge) badge.textContent = st==='busy'?'重複':'時間外'; }
  });
  document.querySelectorAll('.chip.crew').forEach(c=>{
    const cr=CREWS.find(x=>x.id===c.dataset.id); const badge=c.querySelector('.ng');
    if(!cr) return;
    const n2=b?cr.members.filter(m=>whoStatus(m,b)!=='ok').length:0;
    if(n2){ c.dataset.ng='busy'; if(badge) badge.textContent=n2+'人不可'; }
    else{ delete c.dataset.ng; if(badge) badge.textContent=''; }
  });
  const note=$('#whoNote');
  if(note) note.textContent = b ? (ng?('入れない '+ng+'人'):'全員OK') : '';
}

/* ---------- ボード ---------- */
function renderRuler(){
  const r=$('#ruler'); r.innerHTML='';
  const w=(TL_END-TL_START)*state.ppm;
  $('#canvas').style.width=w+'px'; r.style.width=w+'px';
  DAYS.forEach((d,i)=>{
    const s=Math.max(TL_START,i*1440), e=Math.min(TL_END,(i+1)*1440);
    if(e<=s) return;
    const seg=el('b','dayseg');
    seg.style.left=m2x(s)+'px'; seg.style.width=((e-s)*state.ppm)+'px';
    if(i%2===1) seg.dataset.alt='1';
    seg.textContent=d.label;
    r.appendChild(seg);
  });
  const step=state.ppm>=1.6?30:60;
  for(let t=Math.ceil(TL_START/step)*step;t<=TL_END;t+=step){
    const tod=todT(t);
    const i=el('i',(tod===0?'hr day':(tod%60===0?'hr':'')));
    i.style.left=m2x(t)+'px';
    if(tod%60===0 && (state.ppm>=1.2 || tod%180===0)) i.dataset.l=hhmm(tod);
    r.appendChild(i);
  }
}
function renderShade(){
  const sh=$('#shade');
  sh.innerHTML='';
  sh.style.width=((TL_END-TL_START)*state.ppm)+'px';
  sh.style.height=(VL.length*LH)+'px';
  for(let d=0;d<DAYS.length;d++){
    const ns=Math.max(TL_START,d*1440+22*60), ne=Math.min(TL_END,d*1440+1440+5*60);
    if(ne>ns){
      const n=el('div','night');
      n.style.left=m2x(ns)+'px'; n.style.width=((ne-ns)*state.ppm)+'px';
      sh.appendChild(n);
    }
    if(d>0){ const l=el('div','dayline'); l.style.left=m2x(d*1440)+'px'; sh.appendChild(l); }
  }
  if(state.view==='person'){
    VL.forEach((ln,i)=>{
      if(!ln.person) return;
      availAbs(getWho(ln.person)).forEach(w=>{
        const s2=Math.max(TL_START,w[0]), e2=Math.min(TL_END,w[1]); if(e2<=s2) return;
        const a=el('div','okband');
        a.style.left=m2x(s2)+'px'; a.style.width=((e2-s2)*state.ppm)+'px';
        a.style.top=(i*LH)+'px'; a.style.height=LH+'px';
        sh.appendChild(a);
      });
    });
  }
}
function viewLanes(){
  if(state.view==='lane'){
    const out=[];
    LANES.forEach(function(l){
      out.push(l);
      out.push({id:'PL:'+l.id, name:'人', kind:'', people:true, srcLane:l.id});
    });
    return out;
  }
  if(state.view==='diagram'){
    return PLACES.map(p=>({id:'L:'+p.id, name:p.name, kind:'場所', place:p.name}));
  }
  if(state.view==='person'){
    const arr=PEOPLE.map(p=>({id:'P:'+p.id, name:p.name, kind:p.cong, person:p.id}));
    arr.push({id:'P:none', name:'④ 未割当', kind:'だれも入っていない', person:null});
    return arr;
  }
  return LANES;
}
function renderLanes(){
  if(state.view!=='place') document.querySelectorAll('#lanes .mvb').forEach(n=>n.remove());
  if(state.view==='place'){ VL=[]; renderPlaceView(); return; }
  const diagram=state.view==='diagram';
  LH = diagram ? 54 : 84;
  document.documentElement.style.setProperty('--lane-h', LH+'px');
  VL=viewLanes();
  const person=state.view!=='lane';
  const heads=$('#laneHeads'); heads.innerHTML='';
  const body=$('#lanes');
  body.querySelectorAll('.lane').forEach(n=>n.remove());
  VL.forEach((ln,idx)=>{
    const h=el('div','laneh');
    if(diagram){
      const n=BLOCKS.filter(b=> placeIdx(b.place)===idx || (b.to&&placeIdx(b.to)===idx)).length;
      if(!n) h.classList.add('empty');
      h.innerHTML='<div style="font-size:12.5px;font-weight:700;padding:2px 4px">'+esc(ln.name)+'</div>'
        +'<div style="margin-top:auto;font-family:var(--font-mono);font-size:10px;color:var(--ink-soft);padding:0 4px">'+n+'件</div>';
    }else if(person){
      const n=BLOCKS.filter(b=> ln.person ? b.staff.includes(ln.person) : !b.staff.length).length;
      const mins2=BLOCKS.filter(b=> ln.person ? b.staff.includes(ln.person) : !b.staff.length)
                        .reduce((a,b)=>a+b.dur,0);
      if(!n) h.classList.add('empty');
      h.innerHTML='<div style="font-size:13px;font-weight:700;padding:2px 4px">'+esc(ln.name)+'</div>'
        +'<div style="font-size:10.5px;color:var(--ink-soft);padding:0 4px">'+esc(ln.kind||'')+'</div>'
        +'<div style="margin-top:auto;font-family:var(--font-mono);font-size:10px;color:var(--ink-soft);padding:0 4px">'
        +n+'件 / '+durTx(mins2)+'</div>';
    }else if(ln.people){
      const n=BLOCKS.filter(b=>b.laneId===ln.srcLane).reduce(function(a,b){return a+b.staff.length;},0);
      if(!n) h.classList.add('empty');
      h.innerHTML='<div style="font-size:11.5px;color:var(--ink-soft);padding-left:12px">└ 人 '+n+'名</div>';
    }else{
      if(!BLOCKS.some(b=>b.laneId===ln.id)) h.classList.add('empty');
      const inp=el('input'); inp.value=ln.name; inp.setAttribute('aria-label','この行の名前');
      inp.addEventListener('change',()=>{ln.name=inp.value.trim()||'名前なし'; renderAll();});
      const src=truckImg(ln.name);
      let nameRow=inp;
      if(src){
        nameRow=el('div','lhimg');
        const im=el('img'); im.src=src; im.alt='';
        nameRow.append(im,inp);
      }
      const selRow=el('div'); selRow.style.cssText='display:flex;gap:3px';
      const sel=el('select'); sel.setAttribute('aria-label','この行の種類');
      KINDS.forEach(k=>{const o=el('option'); o.value=k; o.textContent=k; if(ln.kind===k)o.selected=true; sel.appendChild(o);});
      sel.addEventListener('change',()=>{ln.kind=sel.value;});
      const selT=el('select'); selT.setAttribute('aria-label','この行のTM');
      selT.innerHTML='<option value="">TM—</option>'+TMS.map(t=>'<option'+((ln.tm||'運送TM')===t?' selected':'')+'>'+esc(tmShort(t))+'TM</option>').join('');
      selT.style.color=tmColor(ln.tm||'運送TM');
      selT.addEventListener('change',()=>{ ln.tm=selT.value?selT.value.replace('TM','')+'TM':null;
        if(selT.value){ const m=TMS.filter(t=>tmShort(t)+'TM'===selT.value)[0]; ln.tm=m||null; }
        renderAll(); });
      selRow.append(sel,selT);
      const ops=el('div','ops');
      ops.innerHTML='<button data-up title="上へ">▲</button><button data-dn title="下へ">▼</button><button data-del title="この行を消す">×</button>';
      ops.querySelector('[data-up]').addEventListener('click',()=>moveLane(idx,-1));
      ops.querySelector('[data-dn]').addEventListener('click',()=>moveLane(idx,1));
      ops.querySelector('[data-del]').addEventListener('click',()=>delLane(ln.id));
      h.append(nameRow,selRow,ops);
    }
    heads.appendChild(h);
    const lane=el('div','lane'+(ln.people?' prow':'')); lane.dataset.lane=ln.id;
    if(ln.people){ lane.dataset.rtype='people'; lane.dataset.src=ln.srcLane; }
    lane.style.setProperty('--hr',(60*state.ppm)+'px');
    body.appendChild(lane);
  });
  if(!person){
    const mk=el('button','addbtn'); mk.style.margin='8px'; mk.style.width='calc(100% - 16px)';
    mk.textContent='この日の予約車両で行を作る';
    mk.addEventListener('click',buildFleetLanes); heads.appendChild(mk);
  }
  renderShade();
  renderBlocks();
}
function makeBlockEl(b,person){
  const ch=getChain(b.chainId), h=getHow(b.howId);
  const list=steps(b.chainId), pos=list.findIndex(x=>x.id===b.id)+1;
  const n=el('div','block'); n.dataset.id=b.id;
  n.style.left=m2x(b.t)+'px';
  n.style.width=Math.max(46,b.dur*state.ppm)+'px';
  const tm=blkTM(b);
  n.style.borderLeftColor=tmColor(tm);
  n.style.borderLeftWidth='6px';
  if(!inTM(tm)) n.classList.add('dim');
  if(conflictsOf(b).length) n.dataset.conflict='1';
  if(outsideAvail(b).length) n.dataset.outside='1';
  if(state.sel===b.id) n.dataset.selected='1';
  if(MULTI[b.id]) n.dataset.multi='1';
  const hl=state.hoverStaff||state.focus;
  if(hl&&b.staff.includes(hl)) n.dataset.linked='1';
  const names=b.staff.map(s=>{const p=getWho(s); return p?p.name.split(' ')[0]:'';}).join('・');
  const head='<div class="bt"><b>'+pos+'/'+list.length+'</b> '+hhmmT(b.t)+'–'+hhmmT(b.t+b.dur)+' '+durTx(b.dur)+'</div>';
  const tail='<div class="hand l" data-h="l"></div><div class="hand r" data-h="r"></div>'
    +(person?'':'<div class="link" title="ここから紐を引いて、ほかのブロックにつなぐ">⇢</div>');
  if(h&&h.ride){
    const nm=b.staff.map(s=>{const p=getWho(s); return p?p.name.split(' ')[0]:'';}).join('・');
    n.innerHTML=head
      +'<div class="bm">🚐 '+esc(b.stops?b.stops.map(s=>s.place).join('→'):'送迎')+'</div>'
      +'<div class="bs">'+(nm?esc(nm)+'（'+b.staff.length+'名）':'まだ誰も乗っていません')+'</div>'+tail;
  }else if(person){
    const ln=LANES.find(l=>l.id===b.laneId);
    n.innerHTML=head
      +'<div class="bm">'+(h?esc(h.name):'③ 未設定')+'</div>'
      +'<div class="bs"><b>'+esc(ln?ln.name:'—')+'</b> ／ '+esc(b.place||'場所未設定')+'</div>'+tail;
  }else{
    const nL=(b.load||[]).length, nD=(b.drop||[]).length;
    const cnt=nL?'　積'+nL+'点':(nD?'　降'+nD+'点':'');
    const bigIcon = h ? (h.truck?truckSVG(''):'<span class="big">'+(h.ic||'')+'</span>') : '<span class="big">❔</span>';
    n.innerHTML='<div class="tmb" style="background:'+tmColor(tm)+'">'+esc(tmShort(tm))+'</div>'
      +'<div class="bm" style="margin-top:3px"><span class="cdot" style="background:'+chainColor(b.chainId)+'"></span>'
      +bigIcon+esc(h?h.name:'やること未設定')+'</div>'
      +'<div class="bs">📍'+esc(b.place||'場所未設定')+esc(cnt)+'</div>'+tail;
  }
  return n;
}
function renderBlocks(){
  if(state.view==='place'){ renderPlaceView(); return; }
  document.querySelectorAll('#lanes .mvb').forEach(n=>n.remove());   /* 場所ビューの移動バッジを片づける */
  document.querySelectorAll('.lane').forEach(l=>l.innerHTML='');
  if(state.view==='diagram'){
    let bad0=0; BLOCKS.forEach(b=>{ if(conflictsOf(b).length) bad0++; });
    renderDiagram();
    const f0=$('#flag');
    f0.textContent='重複 '+Math.ceil(bad0/2)+'件';
    f0.dataset.state=bad0?'bad':'ok';
    updateMoveFlag();
    return;
  }
  $('#wires').style.pointerEvents='none';
  const person=state.view==='person';
  let bad=0;
  BLOCKS.forEach(b=>{ if(conflictsOf(b).length) bad++; });
  BLOCKS.forEach(b=>{
    const ids = person ? (b.staff.length ? b.staff.map(s=>'P:'+s) : ['P:none']) : [b.laneId];
    ids.forEach(lid=>{
      const lane=document.querySelector('.lane[data-lane="'+lid+'"]');
      if(lane) lane.appendChild(makeBlockEl(b,person));
    });
  });
  if(state.view==='lane') renderLanePeople();
  if(state.view==='lane'){
    CHAINS.forEach(c=>{
      const list=steps(c.id); if(!list.length) return;
      const last=list[list.length-1];
      const lane=document.querySelector('.lane[data-lane="'+last.laneId+'"]'); if(!lane) return;
      const k=el('button','knob'); k.dataset.chain=c.id; k.textContent='＋';
      k.title='次のやることをつなげる';
      k.style.left=(m2x(last.t+last.dur)+7)+'px';
      k.style.top=((LH-26)/2)+'px';
      lane.appendChild(k);
    });
  }
  if(person) renderMoveHints();
  drawWires();
  const f=$('#flag');
  f.textContent='重複 '+Math.ceil(bad/2)+'件';
  f.dataset.state=bad?'bad':'ok';
  updateMoveFlag();
}
function updateMoveFlag(){
  updateFootFlag();
  const sh=moveShortages(), f2=$('#flag2');
  if(!f2) return;
  f2.textContent='移動不足 '+sh.length+'件';
  f2.dataset.state=sh.length?'bad':'ok';
}
function renderDiagram(){
  const svg=$('#wires');
  svg.style.pointerEvents='none';
  svg.setAttribute('width',(TL_END-TL_START)*state.ppm);
  svg.setAttribute('height',VL.length*LH);
  const y=i=>i*LH+LH/2;
  let h='';
  CHAINS.forEach(c=>{
    const list=steps(c.id), col=chainColor(c.id);
    let prev=null;
    list.forEach(b=>{
      if(b.stops&&b.stops.length>1){
        const legs=rideLegs(b), colr=chainColor(c.id);
        legs.forEach((lg,li)=>{
          const lx1=m2x(lg.t), lx2=m2x(lg.t+lg.dur);
          const ly1=y(placeIdx(lg.from)), ly2=y(placeIdx(lg.to));
          h+='<g class="seg" data-id="'+b.id+'" data-chain="'+c.id+'">'
           + '<path class="hit" d="M'+lx1+','+ly1+' L'+lx2+','+ly2+'"/>'
           + '<path d="M'+lx1+','+ly1+' L'+lx2+','+ly2+'" fill="none" stroke="'+colr+'" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 5" stroke-linejoin="round"/>'
           + '<circle cx="'+lx1+'" cy="'+ly1+'" r="3.6" fill="#fff" stroke="'+colr+'" stroke-width="2"/>'
           + '<circle cx="'+lx2+'" cy="'+ly2+'" r="3.6" fill="#fff" stroke="'+colr+'" stroke-width="2"/>';
          const st=b.stops[li], st2=b.stops[li+1];
          const lab=(st.pick.length?'乗'+st.pick.length:'')+(st2&&st2.drop.length?' 降'+st2.drop.length:'');
          if(lab) h+='<text x="'+((lx1+lx2)/2)+'" y="'+(((ly1+ly2)/2)-8)+'" text-anchor="middle">'+esc(lab)+'</text>';
          h+='</g>';
        });
        prev=b; return;
      }
      const i1=placeIdx(b.place), i2=placeIdx(b.to||b.place);
      const x1=m2x(b.t), x2=m2x(b.t+b.dur);
      const bad=conflictsOf(b).length>0;
      const dim=state.hoverStaff && !b.staff.includes(state.hoverStaff);
      const op=dim?0.2:0.95;
      const w=(state.sel===b.id)?5.4:3.4;
      const stroke=bad?'#BE2F27':col;
      if(prev){
        const px=m2x(prev.t+prev.dur), pi=placeIdx(prev.to||prev.place);
        h+='<path d="M'+px+','+y(pi)+' L'+x1+','+y(i1)+'" fill="none" stroke="'+col+'" stroke-width="1.2" '
         + 'stroke-dasharray="2 4" opacity="'+(dim?0.15:0.6)+'"/>';
      }
      const hw=getHow(b.howId), ln=LANES.find(l=>l.id===b.laneId);
      const names=b.staff.map(s=>{const p=getWho(s); return p?p.name.split(' ')[0]:'';}).join('・');
      const mid=(x1+x2)/2, midY=(y(i1)+y(i2))/2;
      h+='<g class="seg" data-id="'+b.id+'" data-chain="'+c.id+'">'
       + '<path class="hit" d="M'+x1+','+y(i1)+' L'+x2+','+y(i2)+'"/>'
       + '<path d="M'+x1+','+y(i1)+' L'+x2+','+y(i2)+'" fill="none" stroke="'+stroke+'" stroke-width="'+w+'" '
       + 'stroke-linecap="round" opacity="'+op+'"'+(b.staff.length?'':' stroke-dasharray="7 4"')+'/>'
       + '<g class="pt" data-id="'+b.id+'" data-end="s"><circle class="ring" cx="'+x1+'" cy="'+y(i1)+'" r="11"/>'
       + '<circle cx="'+x1+'" cy="'+y(i1)+'" r="4.6" fill="#fff" stroke="'+stroke+'" stroke-width="2.2" opacity="'+op+'"/></g>'
       + '<g class="pt" data-id="'+b.id+'" data-end="e"><circle class="ring" cx="'+x2+'" cy="'+y(i2)+'" r="11"/>'
       + '<circle cx="'+x2+'" cy="'+y(i2)+'" r="4.6" fill="#fff" stroke="'+stroke+'" stroke-width="2.2" opacity="'+op+'"/></g>'
       + '<text class="big" x="'+mid+'" y="'+(midY-9)+'" text-anchor="middle" opacity="'+op+'">'
       + esc((hw?hw.name:'③未設定'))+'</text>'
       + '<text x="'+mid+'" y="'+(midY+15)+'" text-anchor="middle" opacity="'+op+'">'
       + esc((ln?ln.name:'')+(names?' / '+names:' / ④未割当'))+'</text>'
       + '</g>';
      prev=b;
    });
    if(prev){
      const kx=m2x(prev.t+prev.dur)+16, ky=y(placeIdx(prev.to||prev.place));
      h+='<g class="knobg" data-chain="'+c.id+'">'
       + '<circle cx="'+kx+'" cy="'+ky+'" r="11" fill="#fff" stroke="'+col+'" stroke-width="1.4" stroke-dasharray="3 2"/>'
       + '<text x="'+kx+'" y="'+(ky+4.5)+'" text-anchor="middle" style="font-size:14px" fill="'+col+'">＋</text></g>';
    }
  });
  svg.innerHTML='<defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="context-stroke"></path></marker></defs>'+h;
}
function inferPlace(chainId,howId,last){
  const c=getChain(chainId), h=getHow(howId);
  const d=(c&&c.loads.length)?getDo(c.loads[0]):null;
  const org=(d&&!d.blank)?d.from:(last?(last.to||last.place):null);
  const dst=(d&&!d.blank)?d.to:null;
  const cur=last?(last.to||last.place):org;
  if(h){
    if(h.name.indexOf('引取')>=0||h.name.indexOf('返却')>=0) return {place:'レンタル会社', to:null};
    if(h.name.indexOf('荷降')>=0) return {place:dst||cur, to:null};
  }
  return {place:cur, to:null};
}
function renderLanePeople(){
  document.querySelectorAll('.lane[data-rtype="people"]').forEach(function(lane){
    const src=lane.dataset.src;
    const items=[];
    BLOCKS.filter(function(b){return b.laneId===src;}).forEach(function(b){
      b.staff.forEach(function(pid){ items.push({b:b, pid:pid}); });
    });
    items.sort(function(a,b2){ return a.b.t-b2.b.t; });
    const ends=[];
    items.forEach(function(it){
      let i=0; while(ends[i]!==undefined && ends[i]>it.b.t) i++;
      ends[i]=it.b.t+it.b.dur; it.lv=i;
    });
    items.forEach(function(it){
      const p=getWho(it.pid), h=getHow(it.b.howId);
      if(!p) return;
      const d=el('div','ps');
      d.style.left=m2x(it.b.t)+'px';
      d.style.top=(6+it.lv*30)+'px';
      d.style.width=Math.max(66,it.b.dur*state.ppm)+'px';
      const col=pColor(it.pid);
      d.style.borderColor=col; d.style.color=col; d.style.background='#fff';
      d.title=hhmmT(it.b.t)+'–'+hhmmT(it.b.t+it.b.dur)+' '+(h?h.name:'');
      d.innerHTML='<span class="cdot" style="background:'+tmColor((p.tm||'運送TM'))+'"></span>'
        +'<span style="font-weight:700">'+esc(p.name.split(' ')[0])+'</span>'
        +'<span style="font-size:10.5px;opacity:.8"> '+esc(h?h.name:'')+'</span>';
      d.onclick=function(){ openDetail(it.b.id); };
      lane.appendChild(d);
    });
    const add=el('button','addp'); add.textContent='＋ 人';
    add.onclick=function(ev){
      const bs=BLOCKS.filter(function(b){return b.laneId===src;}).sort(function(a,b2){return a.t-b2.t;});
      if(!bs.length){ toast('先にこの車両の予定を置いてください。'); return; }
      const target=bs[0];
      showPeopleMenuFor(ev.clientX,ev.clientY,target,function(p){
        if(target.staff.indexOf(p.id)<0) target.staff.push(p.id);
        renderAll();
      });
    };
    lane.appendChild(add);
  });
}
function drawWires(){
  const svg=$('#wires');
  svg.setAttribute('width',(TL_END-TL_START)*state.ppm);
  svg.setAttribute('height',VL.length*LH);
  svg.innerHTML='<defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="context-stroke"></path></marker></defs>';
  function wire(a,b,ai,bi,col,isBad,thin){
    if(ai<0||bi<0) return;
    const x1=m2x(a.t+a.dur), y1=ai*LH+LH/2;
    const x2=m2x(b.t),       y2=bi*LH+LH/2;
    const mx=Math.max(x1+9,x2-9);
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');

   足（その人がどうやって来て、どこへ行くか）

function rideLegs(b){
  const out=[]; if(!b.stops||b.stops.length<2) return out;
  let t=b.t;
  for(let i=0;i<b.stops.length-1;i++){
    if(i>0) t+=5;                                  /* 停車5分 */
    const mv=travelMin(b.stops[i].place,b.stops[i+1].place)||10;
    out.push({from:b.stops[i].place, to:b.stops[i+1].place, t:t, dur:mv});
    t+=mv;
  }
  return out;
}
function rideDur(b){ const l=rideLegs(b); return l.length?(l[l.length-1].t+l[l.length-1].dur-b.t):b.dur; }
function stopTime(b,i){
  const l=rideLegs(b); if(!l.length) return b.t;
  return i===0 ? b.t : (l[i-1].t+l[i-1].dur);
}
function syncRide(b){
  if(!b.stops) return;
  const st=[];
  b.stops.forEach(s=>{ s.pick.concat(s.drop).forEach(p=>{ if(st.indexOf(p)<0) st.push(p); }); });
  b.staff=st;
  b.place=b.stops[0].place;
  b.to=b.stops[b.stops.length-1].place;
  b.dur=rideDur(b);
}
/* その人にとっての乗車地・降車地 */
function startPlaceFor(pid,b){
  if(!b.stops) return b.place;
  let from=b.stops[0].place;
  b.stops.forEach(s=>{ if(s.pick.indexOf(pid)>=0) from=s.place; });
  return from;
}
function endPlaceFor(pid,b){
  if(!b.stops) return b.to||b.place;
  let to=b.stops[b.stops.length-1].place;
  b.stops.forEach(s=>{ if(s.drop.indexOf(pid)>=0) to=s.place; });
  return to;
}
function personBlocks(pid){ return BLOCKS.filter(b=>b.staff.indexOf(pid)>=0).sort((a,b)=>a.t-b.t); }
function footState(pid,b){ return (b.foot&&b.foot[pid])||null; }
function footFor(pid,b){
  const mine=personBlocks(pid);
  let prev=null;
  mine.forEach(o=>{ if(o.id!==b.id && o.t+o.dur<=b.t) prev=o; });
  const st=footState(pid,b);
  if(prev && Math.floor(prev.t/1440)!==Math.floor(b.t/1440)) prev=null;
  if(!prev) return {kind:'first', prev:null, state:st};
  const from=endPlaceFor(pid,prev), here=startPlaceFor(pid,b);
  if(from===here) return {kind:'same', prev:prev, state:st};
  const need=travelMin(from,here), gap=b.t-(prev.t+prev.dur);
  return {kind:'move', prev:prev, from:from, need:need, gap:gap, state:st};
}
function isMoveBlock(b){
  const h=getHow(b.howId);
  return !!(h && (h.id==='h9' || h.ride));
}
function footPending(){
  const out=[];
  PEOPLE.forEach(p=>{
    personBlocks(p.id).forEach(b=>{
      if(isMoveBlock(b)) return;              /* 移動そのものは足の対象外 */
      const f=footFor(p.id,b);
      if(f.state) return;
      if(f.kind==='first'||f.kind==='move') out.push({pid:p.id, b:b, f:f});
    });
  });
  return out;
}

/* 同乗できる便（その場所へ向かう運搬・移動で、直前に着くもの） */
function rideCandidates(pid,b,after){
  return BLOCKS.filter(o=>{
    if(o.id===b.id) return false;
    const h=getHow(o.howId); if(!h||(!h.truck&&!h.ride)) return false;
    if((o.to||o.place)!==b.place) return false;
    const end=o.t+o.dur;
    if(end>b.t || b.t-end>120) return false;
    if(after!=null && o.t<after) return false;
    return o.staff.indexOf(pid)<0;
  }).sort((x,y)=>(y.t+y.dur)-(x.t+x.dur));
}
function newRide(laneId,t,stops,riders){

           staff:[], place:null, to:null, note:'',
           stops:stops.map(p=>({place:p, pick:[], drop:[]}))};
  if(riders&&riders.length){
    riders.forEach(p=>{ b.stops[0].pick.push(p); b.stops[b.stops.length-1].drop.push(p); });

function ensurePlace(name){

/* その人が空いているか（この時間帯にほかの予定が無いか） */
function freeDuring(pid,t0,t1){
  return !BLOCKS.some(o=>o.staff.indexOf(pid)>=0 && o.t<t1 && t0<o.t+o.dur);
}
/* 同じ場所にいて、少し待てば乗せてくれる人 */
function sameSpotDrivers(pid,b,f){
  const origin=f.prev?endPlaceFor(pid,f.prev):'自宅・集合';
  const dep0=f.prev?(f.prev.t+f.prev.dur):(b.t-180);
  const need=travelMin(origin,b.place)||15;
  const out=[];
  PEOPLE.forEach(p=>{
    if(p.id===pid || !seatsOf(p.id)) return;
    let best=null;
    /* その人が出発地で作業を終える時刻の候補 */
    const ends=[];
    BLOCKS.filter(o=>o.staff.indexOf(p.id)>=0).forEach(o=>{
      if(endPlaceFor(p.id,o)===origin) ends.push(o.t+o.dur);
    });
    if(origin==='自宅・集合') ends.push(dep0);
    ends.forEach(e=>{
      const depart=Math.max(dep0,e), arrive=depart+need;
      if(arrive>b.t) return;
      if(!freeDuring(p.id,depart,arrive)) return;
      const wait=depart-dep0;
      if(best===null||wait<best.wait) best={depart:depart, arrive:arrive, wait:wait};
    });
    if(!best) return;
    /* 行き先でもその人に予定があるか（ついでか、送りだけか） */
    const alsoThere=BLOCKS.some(o=>o.staff.indexOf(p.id)>=0 && o.place===b.place && o.t>=best.arrive-5);
    out.push({kind:'new', drv:p.id, t:best.depart, dur:need, wait:best.wait, along:alsoThere,
      cap:seatsOf(p.id), n:2,
      label:p.name.split(' ')[0]+'の車'+(alsoThere?'で一緒に':'で送ってもらう')
        +'（'+hhmmT(best.depart)+'発'+(best.wait>0?'・'+best.wait+'分待ち':'')+'）'});
  });
  out.sort((a,b2)=>(a.along===b2.along?a.wait-b2.wait:(a.along?-1:1)));
  return out;
}
function makeSharedMove(drv,pid,b,t,dur){
  const origin=b.place;

  const from=f.prev?endPlaceFor(pid,f.prev):'自宅・集合';
  const exist=BLOCKS.filter(o=>isMoveBlock(o)&&o.staff.indexOf(drv)>=0
    &&(o.to||o.place)===b.place&&Math.abs(o.t-t)<=15)[0];
  if(exist){
    if(exist.staff.indexOf(pid)<0) exist.staff.push(pid);
    exist.foot=exist.foot||{}; exist.foot[pid]='ride';
    setFoot(pid,b,'ride'); return exist;

  const lane=ensureLane('各自の移動','その他');
  const c={id:uid('c'), loads:[], tm:state.tmNew}; CHAINS.push(c);
  const nb={id:uid('b'), chainId:c.id, howId:'h9', laneId:lane.id,
    t:clamp(t,TL_START,TL_END-dur), dur:dur, staff:[drv,pid],
    place:from, to:b.place, note:''};

/* その場所に着く車（トラック・送迎・だれかの自家用車）の候補 */
function footRideOptions(pid,b,f){

    const ln=LANES.find(l=>l.id===o.laneId);
    out.push({o:o, label:hhmmT(o.t)+' '+(ln?ln.name:'')+'に同乗', cap:CAP_TRUCK, n:o.staff.length+1});
  });
  BLOCKS.forEach(o=>{
    if(!isMoveBlock(o)||o.howId!=='h9') return;
    if(o.staff.indexOf(pid)>=0) return;
    if((o.to||o.place)!==b.place) return;

  });

function joinRide(pid,o,b){

  else if(o.staff.indexOf(pid)<0) o.staff.push(pid);

}

function packLevels(list){
  const ends=[];
  list.forEach(b=>{
    let i=0;
    while(ends[i]!==undefined && ends[i]>b.t) i++;
    ends[i]=b.t+b.dur; b._lv=i;
  });
  return Math.max(1,ends.length);
}
function packShifts(list){
  const ends=[];
  list.forEach(s=>{
    const pv=prevShift(s);
    const start=(pv&&pv.place!==s.place)? Math.min(s.t, pv.t+pv.dur) : s.t-30;
    let i=0; while(ends[i]!==undefined && ends[i]>start) i++;
    ends[i]=s.t+s.dur; s._lv=i;
  });
  return Math.max(1,ends.length);
}
function placeRows(){

    rows.push({type:'place', place:p.name, h:38+68*packLevels(trucks), trucks:trucks});
    const shifts=PSHIFTS.filter(s=>s.place===p.name).sort((a,b)=>a.t-b.t);

}

  heads.innerHTML='';
  body.querySelectorAll('.lane').forEach(n=>n.remove());
  const svg=$('#wires'); svg.innerHTML=''; svg.style.pointerEvents='none';
  GEO={};
  const rows=placeRows();
  let top=0;
  rows.forEach(r=>{
    const h=el('div','laneh'); h.style.height=r.h+'px';
    if(r.type==='place'){
      h.innerHTML='<div style="font-size:13px;font-weight:700">'+esc(r.place)+'</div>'
        +'<div style="font-family:var(--font-mono);font-size:10px;color:var(--ink-soft)">車両・作業 '+r.trucks.length+'件</div>';
    }else{
      const n=[]; r.shifts.forEach(s=>{ if(n.indexOf(s.pid)<0) n.push(s.pid); });
      h.innerHTML='<div style="font-size:11.5px;color:var(--ink-soft);padding-left:10px">└ 人 '+n.length+'名</div>';
    }
    heads.appendChild(h);

    const ln=el('div','lane'+(r.type==='people'?' prow':''));
    ln.style.height=r.h+'px'; ln.style.setProperty('--hr',(60*state.ppm)+'px');
    ln.dataset.rtype=r.type; ln.dataset.place=r.place;
    body.appendChild(ln);

    if(r.type==='place'){
      r.trucks.forEach(b=>{
        const lane=LANES.find(l=>l.id===b.laneId), hw=getHow(b.howId);
        const d=el('div','tblk');
        d.style.left=m2x(b.t)+'px'; d.style.width=Math.max(40,b.dur*state.ppm)+'px';
        d.style.top=(6+(b._lv||0)*68)+'px';
        const tmb=blkTM(b);
        d.style.borderLeftColor=tmColor(tmb);
        if(!inTM(tmb)) d.classList.add('dim');
        if(conflictsOf(b).length) d.dataset.bad='1';
        const wpx=Math.max(46,b.dur*state.ppm);
        const nm=lane?lane.name:'行なし', wk=hw?hw.name:'③未設定';
        d.innerHTML=truckTag(nm,24)+'<div class="nm">'+esc(nm)+'</div><div class="wk">'+esc(wk)+'</div>'
          +'<div class="tmtag" style="background:'+tmColor(tmb)+';margin-top:1px">'+esc(tmShort(tmb))+'</div>';
        if(wpx<86){
          d.innerHTML=truckTag(nm,24);
          const t2=el('div','tlab');
          t2.style.left=(m2x(b.t)+wpx)+'px';
          t2.style.top=(6+(b._lv||0)*68)+'px';
          t2.innerHTML='<b>'+esc(nm)+'</b><span>'+esc(wk)+'</span>';
          ln.appendChild(t2);
        }
        const hl2=el('div','h l'), hr2=el('div','h r');
        d.append(hl2,hr2);
        ln.appendChild(d);
        const ob={t:b.t,dur:b.dur};
        makeDrag(hl2,{start:()=>{ob.t=b.t;ob.dur=b.dur;},
          move:dx=>{ const nt=clamp(snap(ob.t+dx/state.ppm),TL_START,ob.t+ob.dur-SNAP);
            b.dur=ob.t+ob.dur-nt; b.t=nt; renderPlaceView(); }});
        makeDrag(hr2,{start:()=>{ob.t=b.t;ob.dur=b.dur;},
          move:dx=>{ b.dur=clamp(snap(ob.dur+dx/state.ppm),SNAP,TL_END-b.t); renderPlaceView(); }});
        makeDrag(d,{start:()=>{ob.t=b.t;ob.dur=b.dur;},
          move:(dx,ev)=>{
            b.t=clamp(snap(ob.t+dx/state.ppm),TL_START,TL_END-b.dur);
            if(ev){
              const n2=document.elementFromPoint(ev.clientX,ev.clientY);
              const row=n2?n2.closest('.lane[data-rtype="place"]'):null;
              if(row&&row.dataset.place&&row.dataset.place!==b.place){ b.place=row.dataset.place; }
            }
            renderPlaceView();
          },
          tap:()=>openDetail(b.id)});
      });
    }else{
      r.shifts.forEach(s=>drawShift(ln,s,top));
      const add=el('button','addp'); add.textContent='＋ 人';
      add.onclick=ev=>{
        const px=ev.clientX, py=ev.clientY;
        showPeopleMenu(px,py,p=>{
          const sN={id:uid('s'), pid:p.id, place:r.place, t:ABS(state.day,9*60), dur:60, how:null, arrive:null, note:''};
          PSHIFTS.push(sN); renderAll();
          showHowMenu(px,py,hh=>{ sN.how=hh.id; renderAll(); });
        });
      };
      ln.appendChild(add);
    }
    top+=r.h;
  });

  /* 線とバッジ（同じ車で動く人はまとめて1本） */
  body.querySelectorAll('.mvb').forEach(n=>n.remove());
  svg.setAttribute('width',(TL_END-TL_START)*state.ppm);
  svg.setAttribute('height',top);
  let h2='<defs><marker id="pa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">'
    +'<path d="M0,0 L8,4 L0,8 z" fill="context-stroke"></path></marker></defs>';
  const curve=(x1,y1,x2,y2,col,w,dash,arrow,op)=>{
    const mx=(x1+x2)/2;
    return '<path d="M'+x1+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+x2+','+y2+'" fill="none" stroke="'+col+'" '
      +'stroke-width="'+w+'"'+(dash?' stroke-dasharray="5 4"':'')+(arrow?' marker-end="url(#pa)"':'')
      +' opacity="'+(op||0.85)+'"/>';
  };
  const trans=[];
  PEOPLE.forEach(p=>{
    const mine=shiftsOf(p.id), col=pColor(p.id);
    mine.forEach((s,i)=>{
      const g=GEO[s.id]; if(!g) return;
      const prev=i>0?mine[i-1]:null;
      const gp=prev?GEO[prev.id]:null;
      if(prev && prev.place===s.place){
        /* 同じ場所での続き＝細い線 */
        if(gp) h2+=curve(gp.x2,gp.y,g.x1,g.y,col,1.4,false,true,0.6);
        return;
      }
      trans.push({pid:p.id, prev:prev, s:s, g:g, gp:gp, col:col});
    });
  });
  const groups={};
  trans.forEach(t=>{
    const a=t.s.arrive;
    const k=(a&&a.driver)
      ? a.mode+'|'+a.driver+'|'+(t.prev?t.prev.place:'HOME')+'>'+t.s.place+'|'+Math.round(t.s.t/30)
      : 'solo:'+t.s.id;
    (groups[k]=groups[k]||[]).push(t);
  });
  Object.keys(groups).forEach(k=>{
    const g=groups[k], f=g[0], s=f.s, prev=f.prev;
    const need=prev?travelMin(prev.place,s.place):0;
    const gap=prev?(s.t-(prev.t+prev.dur)):999;
    const grp=rideGroup(s), cap=rideCap(s);
    const over=(s.arrive&&s.arrive.mode==='car')?(grp.length+1>cap):(s.arrive&&s.arrive.mode==='truck'?grp.length>cap:false);
    const bad=(prev&&gap<need)||over;
    const undecided=!s.arrive;
    let bx,by;
    if(g.length>1){
      /* 合流点 → 1本 → 分岐点 */
      const ox=Math.max.apply(null,g.map(t=>t.gp?t.gp.x2:t.g.x1-30));
      const oy=g.reduce((a2,t)=>a2+(t.gp?t.gp.y:t.g.y),0)/g.length;
      const dx2=Math.min.apply(null,g.map(t=>t.g.x1));
      const dy=g.reduce((a2,t)=>a2+t.g.y,0)/g.length;
      g.forEach(t=>{
        if(t.gp) h2+=curve(t.gp.x2,t.gp.y,ox,oy,t.col,1.3,false,false,0.5);
        h2+=curve(dx2,dy,t.g.x1,t.g.y,t.col,1.3,false,true,0.5);
      });
      h2+=curve(ox,oy,dx2,dy,bad?'#BE2F27':'#43566A',3.4,undecided||bad,false,0.9);
      bx=(ox+dx2)/2; by=(oy+dy)/2;
    }else{
      const a=f.gp, b2=f.g;
      const x1=a?a.x2:b2.x1-30, y1=a?a.y:b2.y;
      h2+=curve(x1,y1,b2.x1,b2.y,bad?'#BE2F27':f.col,bad?2.4:1.8,undecided||bad,true,0.85);
      bx=a?(a.x2+b2.x1)/2:(b2.x1-24); by=a?(a.y+b2.y)/2:b2.y;
    }
    const badge=el('div','mvb'+(s.arrive?' set':'')+(bad?' bad':''));
    badge.textContent=(s.arrive?moveLabel(s):(prev?'🚗 ？':'🏠 ？'))+(g.length>1?'（'+g.length+'名）':'');
    badge.title=(prev?prev.place:'自宅・集合')+' → '+s.place+(prev&&gap<need?'（'+need+'分必要）':'')
      +(g.length>1?'／'+g.map(t=>(getWho(t.pid)||{}).name||'').join('・'):'');
    badge.style.left=bx+'px'; badge.style.top=by+'px';
    badge.onclick=ev=>pickMeans(ev,s,prev);
    body.appendChild(badge);
  });
  svg.innerHTML=h2;

  const sh=$('#shade');
  sh.style.width=((TL_END-TL_START)*state.ppm)+'px'; sh.style.height=top+'px'; sh.innerHTML='';
  for(let d=0;d<DAYS.length;d++){
    const ns=Math.max(TL_START,d*1440+22*60), ne=Math.min(TL_END,d*1440+1440+5*60);
    if(ne>ns){ const x=el('div','night'); x.style.left=m2x(ns)+'px'; x.style.width=((ne-ns)*state.ppm)+'px'; sh.appendChild(x); }
    if(d>0){ const l=el('div','dayline'); l.style.left=m2x(d*1440)+'px'; sh.appendChild(l); }
  }
  updateMoveFlag(); updateCapFlag();
}
function updateCapFlag(){
  const o=capOver(), f=$('#flag4');
  if(!f) return;
  f.textContent='定員オーバー '+o.length+'件';
  f.dataset.state=o.length?'bad':'ok';
}
function moveLabel(s){
  if(!s.arrive) return '🚗 移動手段は？';
  if(s.arrive.mode==='walk') return '🚶 徒歩';
  if(s.arrive.mode==='own') return '🚙 自分の車';
  if(s.arrive.mode==='truck'){ const l=LANES.find(x=>x.id===s.arrive.driver); return '🚚 '+(l?l.name:'トラック')+'に同乗'; }
  const p=getWho(s.arrive.driver);
  const g=rideGroup(s), cap=rideCap(s), n=g.length+1;
  return '🚗 '+(p?p.name.split(' ')[0]:'')+'の車　'+n+'/'+cap+'人';
}
function drawShift(lane,s,rowTop){
  const lv=s._lv||0, top=10+lv*34;
  const col=pColor(s.pid), p=getWho(s.pid), hw=getHow(s.how);
  const src=s.src?getBlk(s.src):null;
  const d=el('div','ps'); d.dataset.id=s.id;
  d.style.left=m2x(s.t)+'px'; d.style.top=top+'px';
  d.style.width=Math.max(66,s.dur*state.ppm)+'px';
  d.style.borderColor=col; d.style.color=col;
  d.style.background=(shiftClash(s)?'#FDF1F0':'#fff');
  if(shiftClash(s)) d.dataset.bad='1';
  d.title=hhmmT(s.t)+'–'+hhmmT(s.t+s.dur)+' '+s.place;
  const ptm=(p&&p.tm)||'運送TM';
  if(!inTM(ptm)) d.classList.add('dim');
  d.innerHTML='<span class="cdot" style="background:'+tmColor(ptm)+'"></span>'
    +'<span style="font-weight:700">'+esc(p?p.name.split(' ')[0]:'')+'</span>'
    +'<span style="font-size:10.5px;opacity:.85"> '+esc(hw?hw.name:'やること未定')+(src?' ⛓':'')+'</span>'
    +'<div class="h l"></div><div class="h r"></div>';
  if(src) d.title+='（⑤の'+(LANES.find(l=>l.id===src.laneId)||{}).name+'の工程と連動）';
  lane.appendChild(d);

  const plus=el('button','psplus'); plus.textContent='＋'; plus.title='次のやることを選ぶ';
  plus.style.left=(m2x(s.t)+Math.max(66,s.dur*state.ppm)+5)+'px'; plus.style.top=(top+3)+'px';
  plus.style.borderColor=col; plus.style.color=col;
  plus.onclick=ev=>{
    showHowMenu(ev.clientX,ev.clientY,hh=>{
      PSHIFTS.push({id:uid('s'), pid:s.pid, place:s.place, t:s.t+s.dur, dur:60, how:hh.id, arrive:null, note:''});
      renderAll();
      toast('続けて置きました。別の場所なら、その枠を下の場所の行へドラッグ。');
    });
  };
  lane.appendChild(plus);

  GEO[s.id]={x1:m2x(s.t), x2:m2x(s.t)+Math.max(66,s.dur*state.ppm), y:rowTop+top+13};

  const ref=src||s;                       /* ⑤由来なら本体を動かす */
  const o={t:ref.t,dur:ref.dur};
  const redraw=()=>{ syncAllShifts(); renderPlaceView(); };
  makeDrag(d.querySelector('.h.l'),{start:()=>{o.t=ref.t;o.dur=ref.dur;},
    move:dx=>{ const nt=clamp(snap(o.t+dx/state.ppm),TL_START,o.t+o.dur-SNAP); ref.dur=o.t+o.dur-nt; ref.t=nt; redraw(); }});
  makeDrag(d.querySelector('.h.r'),{start:()=>{o.t=ref.t;o.dur=ref.dur;},
    move:dx=>{ ref.dur=clamp(snap(o.dur+dx/state.ppm),SNAP,TL_END-ref.t); redraw(); }});
  makeDrag(d,{start:()=>{o.t=ref.t;o.dur=ref.dur;},
    move:(dx,ev)=>{
      ref.t=clamp(snap(o.t+dx/state.ppm),TL_START,TL_END-ref.dur);
      if(ev){
        const n2=document.elementFromPoint(ev.clientX,ev.clientY);
        const row=n2?n2.closest('.lane[data-rtype="people"]'):null;
        if(row&&row.dataset.place!==ref.place) ref.place=row.dataset.place;
      }
      redraw();
    },
    tap:()=>{ if(src) openDetail(src.id); else openShift(s.id); }});
}
function makeDrag(node,opts){
  node.addEventListener('pointerdown',e=>{
    if(e.button&&e.button!==0) return;
    e.stopPropagation();
    let on=false, timer=null;
    const id=e.pointerId, sx=e.clientX, sy=e.clientY;
    const begin=()=>{ on=true; opts.start&&opts.start(); try{node.setPointerCapture(id);}catch(_){} };
    if(e.pointerType!=='mouse') timer=setTimeout(begin,180);
    const mv=ev=>{
      if(ev.pointerId!==id) return;
      const dx=ev.clientX-sx;
      if(!on){
        if(Math.hypot(dx,ev.clientY-sy)>(ev.pointerType==='mouse'?4:12)){
          if(ev.pointerType==='mouse') begin();
          else { clearTimeout(timer); done(); }
        }
        return;
      }
      ev.preventDefault(); opts.move&&opts.move(dx,ev);
    };
    const up=ev=>{
      if(ev.pointerId!==id) return;
      clearTimeout(timer);
      if(on){ opts.end&&opts.end(); renderAll(); } else { opts.tap&&opts.tap(); }
      done();
    };
    const done=()=>{ document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up); };
    document.addEventListener('pointermove',mv,{passive:false});
    document.addEventListener('pointerup',up);
  },{passive:true});
}
function showPlaceMenu(x,y,cb){
  closeMenu(); menuEl=el('div','menu');
  PLACES.filter(p=>p.name!=='その他・未設定').forEach(p=>{
    const b=el('button'); b.textContent=p.name;
    b.addEventListener('click',()=>{ closeMenu(); cb(p.name); });
    menuEl.appendChild(b);
  });
  document.body.appendChild(menuEl);
  const r=menuEl.getBoundingClientRect();
  menuEl.style.left=Math.max(8,Math.min(x,innerWidth-r.width-10))+'px';
  menuEl.style.top =Math.max(8,Math.min(y,innerHeight-r.height-10))+'px';
  setTimeout(()=>document.addEventListener('pointerdown',outside,{once:true}),0);
}
/* 移動手段えらび */
function pickMeans(ev,s,prev){
  closeMenu(); menuEl=el('div','menu'); menuEl.style.gridTemplateColumns='1fr';
  const from=prev?prev.place:'自宅・集合';
  const mk=(label,fn,warn)=>{
    const b=el('button'); b.textContent=label; b.style.textAlign='left';
    if(warn) b.style.color='var(--alert)';
    b.addEventListener('click',()=>{ closeMenu(); fn(); renderAll(); });
    menuEl.appendChild(b);
  };
  /* 同じ区間を動く人（その人の車で） */
  const mates=[];
  PSHIFTS.forEach(o=>{
    if(o.pid===s.pid) return;
    if(!seatsOf(o.pid)) return;
    const op=prevShift(o);
    const sameFrom = op? op.place===from : (from==='自宅・集合');
    if(o.place===s.place && Math.abs(o.t-s.t)<=60 && sameFrom && mates.indexOf(o.pid)<0) mates.push(o.pid);
  });
  PEOPLE.forEach(p=>{ if(p.id!==s.pid && seatsOf(p.id) && mates.indexOf(p.id)<0) mates.push(p.id); });
  mates.slice(0,6).forEach(pid=>{
    const p=getWho(pid);
    const g=PSHIFTS.filter(o=>o.arrive&&o.arrive.mode==='car'&&o.arrive.driver===pid&&o.place===s.place&&Math.abs(o.t-s.t)<=60);
    const n=g.length+1+1;                       /* いまの人＋運転者 */
    const cap=seatsOf(pid);
    mk(p.name.split(' ')[0]+'の車に乗る（'+n+'/'+cap+'人）'+(n>cap?' ⚠定員オーバー':''),
       ()=>{ s.arrive={mode:'car',driver:pid}; }, n>cap);
  });
  /* トラック同乗 */
  BLOCKS.forEach(b=>{
    const h=getHow(b.howId); if(!h||!h.truck) return;
    if((b.to||b.place)!==s.place) return;
    const end=b.t+b.dur; if(end>s.t||s.t-end>120) return;
    const l=LANES.find(x=>x.id===b.laneId);
    const g=PSHIFTS.filter(o=>o.arrive&&o.arrive.mode==='truck'&&o.arrive.driver===b.laneId&&o.place===s.place&&Math.abs(o.t-s.t)<=60);
    const n=g.length+1;
    mk('🚚 '+(l?l.name:'トラック')+'に同乗（'+n+'/'+CAP_TRUCK+'人）'+(n>CAP_TRUCK?' ⚠定員オーバー':''),
       ()=>{ s.arrive={mode:'truck',driver:b.laneId}; }, n>CAP_TRUCK);
  });
  mk('🚙 自分の車で行く',()=>{ s.arrive={mode:'own',driver:s.pid}; });
  mk('🚶 徒歩・近いので不要',()=>{ s.arrive={mode:'walk',driver:null}; });
  if(s.arrive) mk('↺ 決め直す',()=>{ s.arrive=null; });
  document.body.appendChild(menuEl);
  const r=menuEl.getBoundingClientRect();
  menuEl.style.left=Math.max(8,Math.min(ev.clientX,innerWidth-r.width-10))+'px';
  menuEl.style.top =Math.max(8,Math.min(ev.clientY,innerHeight-r.height-10))+'px';
  setTimeout(()=>document.addEventListener('pointerdown',outside,{once:true}),0);
}
/* ①：人の奉仕枠の詳細 */
function openShift(sid){
  const s=getS(sid); if(!s){ state.panel=null; showEmpty(); return; }
  state.sel=null; state.check=null; state.panel=()=>openShift(sid);
  const p=getWho(s.pid), prev=prevShift(s);
  let html='<div class="okbox"><dt>だれ</dt><dd>'+esc(p?p.name:'')+'</dd>'
    +'<dt>いつ・どこ</dt><dd class="mono">'+dayOfT(s.t).label+' '+hhmmT(s.t)+'–'+hhmmT(s.t+s.dur)+' ／ '+esc(s.place)+'</dd>'
    +'<dt>やること</dt><dd>'+esc((getHow(s.how)||{}).name||'未定')+'</dd>'
    +'<dt>来かた</dt><dd>'+esc(moveLabel(s))+(prev?'（'+esc(prev.place)+'から）':'')+'</dd></div>';
  if(shiftClash(s)) html+='<div class="warnbox">同じ時間に別の場所の予定が入っています。</div>';
  const ov=capOver().filter(x=>rideGroup(x.s).some(o=>o.id===s.id));
  if(ov.length) html+='<div class="warnbox">この車は定員'+ov[0].cap+'人に対して'+ov[0].n+'人です。分けるか、別の手段にしてください。</div>';
  html+='<div class="two"><div class="fld"><label>開始</label><input type="time" id="k-s" step="300" value="'+hhmmT(s.t)+'"></div>'
    +'<div class="fld"><label>終了</label><input type="time" id="k-e" step="300" value="'+hhmmT(s.t+s.dur)+'"></div></div>';
  html+='<div class="fld"><label>場所</label><select id="k-pl">'
    +PLACES.filter(x=>x.name!=='その他・未設定').map(x=>'<option'+(s.place===x.name?' selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div>';
  html+='<div class="fld"><label>やること（③）</label><select id="k-h"><option value="">— 未定 —</option>'
    +HOWS.map(x=>'<option value="'+x.id+'"'+(s.how===x.id?' selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div>';
  html+='<div class="fld"><label>メモ</label><input id="k-n" value="'+esc(s.note)+'"></div>';
  html+='<div class="rowbtns"><button id="k-next">＋ 次の場所へ</button><button class="warn" id="k-del">この枠を消す</button></div>';
  openPanel('① 人の奉仕枠', hhmmT(s.t)+'–'+hhmmT(s.t+s.dur), html);
  $('#k-s').addEventListener('change',ev=>{ const base=Math.floor(s.t/1440)*1440, nt=base+snap(mins(ev.target.value));
    s.dur=Math.max(SNAP,s.t+s.dur-nt); s.t=nt; renderAll(); });
  $('#k-e').addEventListener('change',ev=>{ const base=Math.floor(s.t/1440)*1440; let e2=base+snap(mins(ev.target.value));
    if(e2<=s.t) e2+=1440; s.dur=e2-s.t; renderAll(); });
  $('#k-pl').addEventListener('change',ev=>{ s.place=ev.target.value; renderAll(); });
  $('#k-h').addEventListener('change',ev=>{ s.how=ev.target.value||null; renderAll(); });
  $('#k-n').addEventListener('change',ev=>{ s.note=ev.target.value; renderAll(); });
  $('#k-del').addEventListener('click',()=>{ PSHIFTS=PSHIFTS.filter(x=>x.id!==s.id); state.panel=null; renderAll(); });
  $('#k-next').addEventListener('click',ev=>{
    const r=ev.target.getBoundingClientRect();
    showPlaceMenu(r.left,r.bottom+4,pl=>{
      const need=travelMin(s.place,pl)||0;
      PSHIFTS.push({id:uid('s'), pid:s.pid, place:pl, t:s.t+s.dur+need, dur:60, arrive:null, note:''});
      renderAll();
    });
  });
}
/* ⑤のブロックに入れた人を、場所ビューの人の枠へ自動で反映 */
function syncAllShifts(){
  PSHIFTS=PSHIFTS.filter(s=>{
    if(!s.src) return true;
    const b=getBlk(s.src);
    return !!(b && b.place && b.staff.indexOf(s.pid)>=0);
  });
  BLOCKS.forEach(b=>{
    if(!b.place) return;
    (b.staff||[]).forEach(pid=>{
      let s=PSHIFTS.filter(x=>x.src===b.id&&x.pid===pid)[0];
      if(!s){ s={id:uid('s'), pid:pid, src:b.id, arrive:null, note:''}; PSHIFTS.push(s); }
      s.place=b.place; s.t=b.t; s.dur=b.dur; s.how=b.howId;
    });
  });
}
function renderAll(){
  syncAllShifts();
  saveSoon();
  renderRail(); renderRuler(); renderLanes();
  if(state.panel) state.panel(); else showEmpty();
  if(typeof syncCols==='function') setTimeout(syncCols,0);
}

function setZoom(v){
  const sc=$('#scroller');
  const centerT=TL_START+(sc.scrollLeft+sc.clientWidth/2)/state.ppm;
  state.ppm=clamp(Math.round(v*10)/10,0.4,4);
